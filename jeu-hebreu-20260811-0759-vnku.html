<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chanson</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#0d0d0d;--parch:#161616;--ink:#e8e4dc;--ink2:#b8b2a6;--ink3:#888;
  --gold:#c9a84c;--gold2:#e8c96a;--blue:#1a6aaa;--blue2:#70b0e0;
  --green:#3d7a55;--red:#8b3a3a;--orange:#c9852a;--purple:#b49ee8;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 12% 8%,rgba(201,168,76,.09) 0%,transparent 52%),
             radial-gradient(ellipse at 88% 92%,rgba(30,95,168,.07) 0%,transparent 52%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(201,168,76,.03) 28px,rgba(201,168,76,.03) 29px);
  pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:26px 16px 90px}

.app-header{text-align:center;margin-bottom:18px}
.app-heb{font-family:'Frank Ruhl Libre',serif;font-size:40px;font-weight:900;color:var(--ink);line-height:1.2;text-shadow:2px 2px 0 rgba(201,168,76,.13)}
.app-fr{font-size:16px;font-style:italic;color:var(--ink2);margin-top:2px}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);opacity:.45;margin:10px auto;width:220px}
.ornament::before,.ornament::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.reglages{background:#161616;border:1px solid rgba(201,168,76,.2);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow)}
.reglages .titre-mini{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid rgba(201,168,76,.3);background:rgba(201,168,76,.06);color:var(--ink2);border-radius:20px;padding:5px 13px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chip.tous{border-style:dashed}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink2)}
.switch .box{width:44px;height:24px;border-radius:14px;background:rgba(0,0,0,.15);position:relative;transition:.2s}
.switch .box::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on .box{background:var(--green)}
.switch.on .box::after{left:22px}

.tabs{display:flex;flex-wrap:wrap;gap:5px;background:#111;border-radius:16px;padding:5px;margin-bottom:20px;border:1px solid rgba(201,168,76,.15)}
.tab{flex:1 0 auto;padding:9px 10px;border:none;border-radius:11px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:700;color:var(--ink3);background:transparent;transition:.2s}
.tab.active{background:#1e1e1e;color:var(--ink);box-shadow:0 2px 12px var(--shadow);border:1px solid rgba(201,168,76,.22)}
.tab:hover:not(.active){background:#1a1a1a}

.card{background:#161616;border-radius:18px;padding:20px 20px;box-shadow:0 2px 0 rgba(201,168,76,.18),0 8px 28px var(--shadow);border:1px solid rgba(201,168,76,.18);margin-bottom:14px}
.heb{font-family:'Frank Ruhl Libre',serif;direction:rtl;color:var(--ink)}
.heb-xl{font-size:40px;font-weight:900;text-align:center;line-height:1.3}
.heb-lg{font-size:26px;font-weight:700;line-height:1.6}
.heb-md{font-size:20px;line-height:1.9}
.fr{font-style:italic}
.sens{color:var(--ink3);font-size:15px;margin-top:6px}
.audio-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.1);border:1.5px solid rgba(201,168,76,.3);color:var(--gold);border-radius:20px;padding:4px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:.2s}
.audio-btn:hover{background:rgba(201,168,76,.2)}
.fr-hidden{filter:blur(7px);opacity:.4;cursor:pointer;user-select:none}
.reveal{background:rgba(201,168,76,.08);border:1.5px solid rgba(201,168,76,.25);color:var(--gold);border-radius:9px;padding:6px 10px;cursor:pointer;font-size:14px}
.center{text-align:center}
.badge{display:inline-block;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.b-noms{background:var(--blue)}.b-verbes{background:var(--green)}.b-adjectifs{background:var(--purple)}.b-autre{background:var(--orange)}

table.lex{width:100%;border-collapse:collapse}
table.lex th,table.lex td{padding:9px 8px;border-bottom:1px solid rgba(201,168,76,.15);text-align:left}
table.lex th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}
table.lex td.he{font-family:'Frank Ruhl Libre',serif;direction:rtl;font-size:20px;text-align:right;font-weight:700}
.morpho-row{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px;margin-top:8px}
.morpho-row .k{color:var(--ink3);font-weight:600}
.morpho-he{font-family:'Frank Ruhl Libre',serif;direction:rtl}

.btn{border:none;border-radius:12px;padding:12px 18px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;transition:.2s}
.btn-v{background:var(--green);color:#fff}.btn-f{background:var(--red);color:#fff}
.btn-g{background:var(--gold);color:#fff}
.btn-o{background:transparent;border:1.5px solid rgba(201,168,76,.35);color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.q-card.correct{background:#1a2e22;border-color:#3d7a55}
.q-card.wrong{background:#2a1515;border-color:#8b3a3a}

.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center;margin:14px 0;min-height:44px}
.tile{font-family:'Frank Ruhl Libre',serif;font-size:20px;background:rgba(201,168,76,.12);border:1.5px solid rgba(201,168,76,.35);border-radius:10px;padding:6px 12px;cursor:pointer}
.tile.used{opacity:.3;pointer-events:none}
.zone{min-height:48px;border:2px dashed rgba(201,168,76,.3);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center}

.bilan-pct{font-size:56px;font-weight:900;text-align:center;color:var(--gold)}
.bilan-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(201,168,76,.15);font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div class="app-heb" style="font-family:'Playfair Display',serif;color:var(--gold)">Chanson</div>
    <div class="app-fr">Analyse d'une chanson</div>
    <div class="ornament">✦</div>
  </div>

  <div class="reglages">
    <div class="titre-mini">Réglages</div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div class="switch" id="sw-nikoud" onclick="toggleNikoud()"><span class="box"></span><span>Avec nikoud</span></div>
    </div>
    <div class="titre-mini" style="margin-top:12px">Catégories</div>
    <div class="chips" id="cat-chips"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<script>
/* ============================================================
   STRUCTURE "JEU" = LE CONTRAT que l'IA devra remplir à chaque leçon.
   ============================================================ */
const JEU = {"titre":"Chanson","mots":[{"heb":"עָשִׁיר","translit":"ashir","fr":"riche","sens":"adjectif masculin singulier","racine":"ע-שׁ-ר","nature":"adjectif","genre":"—","nombre":"—","formes":"עֲשִׁירָה · עֲשִׁירִים · עֲשִׁירוֹת","cat":"adjectifs","emploi":""},{"heb":"בּוֹנֶה","translit":"boneh","fr":"bâtissant / qui bâtit","sens":"verbe בנה, binyan Pa'al, participe présent masculin singulier","racine":"ב-נ-ה","nature":"verbe","genre":"—","nombre":"—","formes":"בָּנָה · יִבְנֶה · בְּנֵה · בּוֹנִים","cat":"verbes","emploi":""},{"heb":"מַדְרֵגוֹת","translit":"madregot","fr":"escaliers / marches","sens":"nom féminin pluriel","racine":"ד-ר-ג","nature":"nom","genre":"—","nombre":"—","formes":"מַדְרֵגָה · מַדְרְגוֹת","cat":"noms","emploi":""},{"heb":"גַּבִּיר","translit":"gabir","fr":"notable / homme riche et influent","sens":"nom masculin singulier","racine":"ג-ב-ר","nature":"nom","genre":"—","nombre":"—","formes":"גְּבִירִים · גְּבִירָה","cat":"noms","emploi":""},{"heb":"אַוָּזִים","translit":"avazim","fr":"oies","sens":"nom masculin pluriel","racine":"א-ו-ז","nature":"nom","genre":"—","nombre":"—","formes":"אַוָּז · אַוָּזוֹת","cat":"noms","emploi":""},{"heb":"בַּרְוָזִים","translit":"barvazim","fr":"canards","sens":"nom masculin pluriel","racine":"ב-ר-ו-ז","nature":"nom","genre":"—","nombre":"—","formes":"בַּרְוָז · בַּרְוָזוֹת","cat":"noms","emploi":""},{"heb":"מִרְפֶּסֶת","translit":"mirpeset","fr":"balcon / véranda","sens":"nom féminin singulier","racine":"ר-פ-ס","nature":"nom","genre":"—","nombre":"—","formes":"מִרְפְּסוֹת · מִרְפֶּסֶת","cat":"noms","emploi":""},{"heb":"מִתְנַפַּחַת","translit":"mitnapakhat","fr":"se rengorgeant / se gonflant d'orgueil","sens":"verbe נפח, binyan Hitpa'el, participe présent féminin singulier","racine":"נ-פ-ח","nature":"verbe","genre":"—","nombre":"—","formes":"מִתְנַפֵּחַ · מִתְנַפְּחִים · מִתְנַפְּחוֹת","cat":"verbes","emploi":""},{"heb":"טַוָּס","translit":"tavas","fr":"paon","sens":"nom masculin singulier","racine":"ט-ו-ס","nature":"nom","genre":"—","nombre":"—","formes":"טַוָּסִים · טַוָּסָה","cat":"noms","emploi":""},{"heb":"עֵצָה","translit":"etsah","fr":"conseil / avis","sens":"nom féminin singulier","racine":"י-ע-ץ","nature":"nom","genre":"—","nombre":"—","formes":"עֵצוֹת · בְּעֵצָתִי","cat":"noms","emploi":""},{"heb":"מִנְהָג","translit":"minhag","fr":"coutume / usage","sens":"nom masculin singulier","racine":"נ-ה-ג","nature":"nom","genre":"—","nombre":"—","formes":"מִנְהָגִים · מִנְהַג","cat":"noms","emploi":""},{"heb":"בֵּית הַמִּדְרָשׁ","translit":"beit ha-midrash","fr":"maison d'étude / maison de prière","sens":"expression nominale masculine singulier défini","racine":"ד-ר-שׁ","nature":"expression","genre":"—","nombre":"—","formes":"בָּתֵּי מִדְרָשׁ · בֵּית מִדְרָשׁ","cat":"autre","emploi":""},{"heb":"כֹּתֶל הַמִּזְרָח","translit":"kotel ha-mizrakh","fr":"le mur est / place d'honneur orientale dans la synagogue","sens":"expression nominale masculine singulier défini","racine":"מ-ז-ר-ח","nature":"expression","genre":"—","nombre":"—","formes":"מִזְרָח · כֹּתֶל","cat":"autre","emploi":""},{"heb":"מוֹשִׁיעָם","translit":"moshi'am","fr":"leur sauveur / celui qui les sauve","sens":"verbe ישע, binyan Hif'il, participe présent ms avec suffixe 3mp","racine":"י-שׁ-ע","nature":"verbe","genre":"—","nombre":"—","formes":"מוֹשִׁיעַ · מוֹשִׁיעִים · הוֹשִׁיעַ","cat":"verbes","emploi":""},{"heb":"נִגְרַע","translit":"nigra","fr":"serait-il retranché / perdu / manquerait-il","sens":"verbe גרע, binyan Nif'al, passé 3ms (ici valeur conditionnelle)","racine":"ג-ר-ע","nature":"verbe","genre":"—","nombre":"—","formes":"נִגְרְעוּ · יִגָּרַע · גָּרַע","cat":"verbes","emploi":""}],"phrases":[{"heb":"לוּ הָיִיתִי אִישׁ עָשִׁיר","fr":"Si j'avais été un homme riche"},{"heb":"הָיִיתִי אָז בּוֹנֶה לִי בַּיִת מֵאֶבֶן","fr":"J'aurais alors bâti pour moi une maison de pierre"},{"heb":"שָׁלוֹשׁ שׁוּרוֹת מַדְרֵגוֹת עַל יַד הַקִּיר","fr":"Trois rangées de marches contre le mur"},{"heb":"רַק שֶׁיֵּדְעוּ שֶׁזֶּה בֵּיתוֹ שֶׁל גַּבִּיר","fr":"Juste pour qu'on sache que c'est la maison d'un notable"},{"heb":"כֻּלָּם אַוָּזִים וּבַרְוָזִים","fr":"Tous des oies et des canards"},{"heb":"כֻּלָּם אַוָּזִים וּבַרְוָזִים","fr":"Tous des oies et des canards"},{"heb":"הִיא גּוּלְדָּה, שָׁם עַל הַמִּרְפֶּסֶת","fr":"Elle, Golda, là sur le balcon"},{"heb":"מִתְנַפַּחַת - אוֹי! - כְּמוֹ טַוָּס","fr":"Se gonflant - oh ! - comme un paon"},{"heb":"מִתְנַפַּחַת - אוֹי! - כְּמוֹ טַוָּס","fr":"Se gonflant - oh ! - comme un paon"},{"heb":"יָבוֹאוּ כָּל חַכְמֵי הָעִיר לִשְׁאוֹל בְּעֵצָתִי","fr":"Tous les sages de la ville viendraient me demander conseil"},{"heb":"מַה הַדִּין וְהַמִּנְהָג","fr":"Quelle est la loi et la coutume"},{"heb":"וְאָז אוּכַל סוֹף סוֹף בְּבֵית הַמִּדְרָשׁ","fr":"Et alors je pourrai enfin à la maison d'étude"},{"heb":"לָשֶׁבֶת סוֹף סוֹף עַל יַד כֹּתֶל הַמִּזְרָח","fr":"M'asseoir enfin près du mur de l'est"},{"heb":"הָעוֹזֵר דַּלִּים וּמוֹשִׁיעָם","fr":"Celui qui aide les pauvres et les sauve"},{"heb":"מַה הָיָה נִגְרַע כְּבָר בָּעוֹלָם","fr":"Qu'est-ce qui aurait manqué au monde"}],"textes":[{"titre":"עֵצָה","heb":"יָבוֹאוּ כָּל חַכְמֵי הָעִיר לִשְׁאוֹל בְּעֵצָתִי, גַּם הָרַב אוֹתִי יִשְׁאַל אָז - מַה הַדִּין וְהַמִּנְהָג.","fr":"Tous les sages de la ville viendraient me demander conseil, et même le rabbin m'interrogerait alors - quelle est la loi et la coutume."},{"titre":"חֲלוֹם הֶעָנִי","heb":"אִילּוּ הָיִיתִי עָשִׁיר, הָיִיתִי בּוֹנֶה בַּיִת גָּדוֹל, יוֹשֵׁב בְּבֵית הַמִּדְרָשׁ כָּל הַיָּמִים, וּמִתְפַּלֵּל לַיּי בְּשָׁלוֹם. אֲבָל אֲנִי עָנִי, וְחֶלְקִי - רַק לַחֲלוֹם.","fr":"Si j'avais été riche, j'aurais bâti une grande maison, je me serais assis à la maison d'étude tous les jours, et j'aurais prié Dieu en paix. Mais je suis pauvre, et mon lot - c'est seulement de rêver."},{"titre":"תְּפִלַּת הֶעָנִי","heb":"רִבּוֹנוֹ שֶׁל עוֹלָם, הָעוֹזֵר דַּלִּים וּמוֹשִׁיעָם, הִנְנִי לְפָנֶיךָ. לֹא מָמוֹן אֲנִי מְבַקֵּשׁ, רַק מְעַט שַׁלְוָה, כְּדֵי לִלְמוֹד תּוֹרָתֶךָ וּלְהָאִיר אֶת חַיַּי. מַה הָיָה נִגְרַע כְּבָר בָּעוֹלָם לוּ הָיִיתִי קְצָת עָשִׁיר?","fr":"Maître du monde, Toi qui aides les pauvres et les sauve, me voici devant Toi. Ce n'est pas la fortune que je demande, juste un peu de tranquillité, pour étudier Ta Torah et illuminer ma vie. Qu'aurait-il manqué au monde si j'avais été un peu riche ?"}],"analyse":"La chanson adopte un registre populaire yiddish-hébraïque teinté d'humour tendre et d'autodérision, typique du répertoire ashkénaze de scène. Le locuteur, homme pauvre et simple, rêve à voix haute d'une richesse fantasmée, déclinée en images concrètes et savoureuses : escaliers inutiles mais ostentatoires, oies bruyantes, épouse gonflée d'orgueil comme un paon. La répétition des refrains onomatopéiques (אבה דגה, קוקוריקו) crée un effet comique et musical qui renforce le côté rêverie enfantine. Sous l'humour affleure une critique sociale douce-amère : le pauvre n'aspire pas à l'injustice mais à la dignité, à l'étude et à la prière, valeurs spirituelles placées au sommet du rêve. La chute finale, adressée à Dieu lui-même, bascule vers une plainte lyrique universelle qui transcende le comique et touche à l'essentiel de la condition humaine."};
/* ↑ VIDE — l'IA remplit mots/phrases/textes/analyse à chaque leçon. */

let sansNikoud = false;
let selCats = new Set(JEU.mots.map(m=>m.cat));
let score = {ok:0, ko:0};

const NIKOUD = /[\u0591-\u05C7]/g;
function strip(s){ return String(s).replace(NIKOUD,''); }
function H(s){ return sansNikoud ? strip(s) : s; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function motsF(){ return JEU.mots.filter(m=>selCats.has(m.cat)); }
function badgeClass(c){ return ['noms','verbes','adjectifs'].includes(c) ? 'b-'+c : 'b-autre'; }

function say(txt){
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(strip(txt)); u.lang='he-IL'; u.rate=.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function audioBtn(txt){ return '<button class="audio-btn" onclick="say(\''+String(txt).replace(/'/g,"\\'")+'\')">🔊 Écouter</button>'; }

const TABS = [
  {id:'mots',lbl:'Mots'},{id:'morpho',lbl:'Morphologie'},{id:'lexique',lbl:'Lexique'},
  {id:'phrases',lbl:'Phrases'},{id:'analyse',lbl:'Analyse'},{id:'vf',lbl:'Vrai/Faux'},
  {id:'recon',lbl:'Reconstituer'},{id:'bilan',lbl:'Score'}
];
let ongletCourant = 'mots';
function initTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    '<button class="tab'+(t.id===ongletCourant?' active':'')+'" onclick="showTab(\''+t.id+'\')">'+t.lbl+'</button>').join('');
}
function showTab(id){ ongletCourant=id; initTabs(); render(); }

function initReglages(){
  const cats = [...new Set(JEU.mots.map(m=>m.cat))];
  let html = '<button class="chip tous'+(selCats.size===cats.length?' on':'')+'" onclick="toutesCats()">Toutes</button>';
  html += cats.map(c=>'<button class="chip '+(selCats.has(c)?'on':'')+'" onclick="toggleCat(\''+c+'\')">'+c+'</button>').join('');
  document.getElementById('cat-chips').innerHTML = html;
  const sw=document.getElementById('sw-nikoud');
  sw.className = 'switch'+(sansNikoud?'':' on');
  sw.querySelector('span:last-child').textContent = sansNikoud ? 'Sans nikoud' : 'Avec nikoud';
}
function toggleNikoud(){ sansNikoud=!sansNikoud; initReglages(); render(); }
function toggleCat(c){ if(selCats.has(c)){ if(selCats.size>1) selCats.delete(c);} else selCats.add(c); vfList=[]; initReglages(); render(); }
function toutesCats(){ selCats = new Set(JEU.mots.map(m=>m.cat)); vfList=[]; initReglages(); render(); }

function render(){
  if(!JEU.mots || JEU.mots.length===0){
    document.getElementById('content').innerHTML = '<div class="card center" style="padding:44px 20px;color:var(--ink3)"><div style="font-size:40px;margin-bottom:12px;color:var(--gold)">✦</div>En attente des mots de la chanson.<br>Le jeu se remplit dès que l\'élève fait sa demande.</div>';
    return;
  }
  const map = {mots:rMots,morpho:rMorpho,lexique:rLexique,phrases:rPhrases,textes:rTextes,analyse:rAnalyse,vf:rVF,recon:rRecon,bilan:rBilan};
  document.getElementById('content').innerHTML = (map[ongletCourant]||(()=> ''))();
}

function rMots(){
  return motsF().map((m,i)=>
    '<div class="card center">'
    + '<span class="badge '+badgeClass(m.cat)+'">'+m.cat+'</span>'
    + '<div class="heb heb-xl">'+H(m.heb)+'</div>'
    + '<div style="margin:8px 0">'+audioBtn(m.heb)+'</div>'
    + '<div class="fr fr-hidden" id="fr'+i+'" onclick="this.classList.remove(\'fr-hidden\')" style="font-size:20px">'+esc(m.fr)+'</div>'
    + '<div class="reveal" style="display:inline-block;margin-top:8px" onclick="document.getElementById(\'fr'+i+'\').classList.remove(\'fr-hidden\')">Révéler la traduction</div>'
    + '<div class="sens">Sens : '+esc(m.sens)+'</div>'
    + '</div>').join('');
}
function rMorpho(){
  return motsF().map(m=>
    '<div class="card">'
    + '<div class="heb heb-lg center">'+H(m.heb)+'</div>'
    + '<div class="morpho-row">'
    +   '<span class="k">Racine</span><span class="morpho-he">'+m.racine+'</span>'
    +   '<span class="k">Nature</span><span>'+esc(m.nature)+'</span>'
    +   '<span class="k">Genre / Nombre</span><span>'+esc(m.genre)+' · '+esc(m.nombre)+'</span>'
    +   '<span class="k">Formes</span><span class="morpho-he">'+H(m.formes)+'</span>'
    +   '<span class="k">Emploi</span><span>'+esc(m.emploi)+'</span>'
    + '</div></div>').join('');
}
function rLexique(){
  return '<div class="card"><table class="lex"><tr><th>Hébreu</th><th>Translit.</th><th>Français</th></tr>'
    + motsF().map(m=>'<tr><td class="he">'+H(m.heb)+'</td><td>'+esc(m.translit)+'</td><td class="fr">'+esc(m.fr)+'</td></tr>').join('')
    + '</table></div>';
}
function rPhrases(){
  return JEU.phrases.map(p=>
    '<div class="card">'
    + '<div class="heb heb-md" style="text-align:right">'+H(p.heb)+'</div>'
    + '<div style="margin:6px 0">'+audioBtn(p.heb)+'</div>'
    + '<div class="fr">'+esc(p.fr)+'</div>'
    + '</div>').join('');
}
function rTextes(){
  return JEU.textes.map(t=>
    '<div class="card">'
    + '<span class="badge b-autre">'+esc(t.titre)+'</span>'
    + '<div class="heb heb-md" style="text-align:right">'+H(t.heb)+'</div>'
    + '<div style="margin:6px 0">'+audioBtn(t.heb)+'</div>'
    + '<div class="fr">'+esc(t.fr)+'</div>'
    + '</div>').join('');
}

let vfList=[], vfIdx=0;
function rVF(){
  if(!vfList.length) buildVF();
  if(vfIdx>=vfList.length){
    return '<div class="card center"><h3>Quiz terminé</h3><p style="font-size:18px;margin:10px 0">'+score.ok+' justes · '+score.ko+' erreurs</p><button class="btn btn-g" onclick="resetVF()">Recommencer</button></div>';
  }
  const q=vfList[vfIdx];
  return '<div class="card q-card center" id="qc">'
    + '<div class="heb heb-xl">'+H(q.heb)+'</div>'
    + '<div style="margin:8px 0">'+audioBtn(q.heb)+'</div>'
    + '<div style="font-size:12px;color:#bbb;text-transform:uppercase;letter-spacing:.8px;margin:8px 0 2px">Traduction proposée</div>'
    + '<div class="fr" style="font-size:22px;margin-bottom:16px">'+esc(q.propose)+'</div>'
    + '<div class="row" style="justify-content:center">'
    +   '<button class="btn btn-v" onclick="ansVF(true)">✓ Vrai</button>'
    +   '<button class="btn btn-f" onclick="ansVF(false)">✗ Faux</button>'
    + '</div></div>';
}
function buildVF(){
  const mots=motsF(); vfList=[]; vfIdx=0;
  mots.forEach(m=>{
    const vrai = Math.random()<0.5;
    let propose = m.fr;
    if(!vrai){ const autres=mots.filter(x=>x.fr!==m.fr); propose=(autres[Math.floor(Math.random()*autres.length)]||m).fr; }
    vfList.push({heb:m.heb, propose, vrai: propose===m.fr});
  });
  vfList.sort(()=>Math.random()-0.5);
}
function ansVF(rep){
  const q=vfList[vfIdx]; const bon=(rep===q.vrai);
  bon?score.ok++:score.ko++;
  const qc=document.getElementById('qc'); if(qc) qc.classList.add(bon?'correct':'wrong');
  setTimeout(()=>{ vfIdx++; render(); },650);
}
function resetVF(){ vfList=[]; vfIdx=0; render(); }

let reconIdx=0, reconChoix=[], reconBank=null;
function rRecon(){
  const p=JEU.phrases[reconIdx];
  const mots=strip(p.heb).split(/\s+/).filter(Boolean);
  if(!reconBank){ reconBank = mots.map((w,i)=>({w,i})).slice().sort(()=>Math.random()-0.5); }
  const zone = reconChoix.map(c=>'<span class="tile" onclick="reconRetire('+c.i+')">'+c.w+'</span>').join('');
  const tiles = reconBank.map(b=>'<span class="tile'+(reconChoix.find(c=>c.i===b.i)?' used':'')+'" onclick="reconAjoute('+b.i+')">'+b.w+'</span>').join('');
  const fini = reconChoix.length===mots.length;
  const ok = fini && reconChoix.map(c=>c.w).join(' ')===mots.join(' ');
  return '<div class="card">'
    + '<div class="fr center" style="margin-bottom:6px">'+esc(p.fr)+'</div>'
    + '<div class="titre-mini center">Remets les mots dans l\'ordre (droite → gauche)</div>'
    + '<div class="zone">'+ (zone||'<span style="color:#bbb">…</span>') +'</div>'
    + '<div class="tiles">'+tiles+'</div>'
    + (fini ? '<div class="center" style="font-size:18px;color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'✓ Correct !':'✗ Pas encore')+'</div>' : '')
    + '<div class="row" style="justify-content:center;margin-top:12px">'
    +   '<button class="btn btn-o" onclick="reconReset()">Effacer</button>'
    +   '<button class="btn btn-g" onclick="reconNext()">Phrase suivante</button>'
    + '</div></div>';
}
function reconAjoute(i){ const m=strip(JEU.phrases[reconIdx].heb).split(/\s+/)[i]; if(!reconChoix.find(c=>c.i===i)){ reconChoix.push({w:m,i}); render(); } }
function reconRetire(i){ reconChoix=reconChoix.filter(c=>c.i!==i); render(); }
function reconReset(){ reconChoix=[]; reconBank=null; render(); }
function reconNext(){ reconIdx=(reconIdx+1)%JEU.phrases.length; reconChoix=[]; reconBank=null; render(); }

function rAnalyse(){ return '<div class="card"><span class="badge b-autre">Analyse de langue de la chanson</span><div class="fr" style="font-size:16px;line-height:1.75;margin-top:8px">'+esc(JEU.analyse||'\u2014')+'</div></div>'; }
function rBilan(){
  const tot=score.ok+score.ko; const pct=tot?Math.round(score.ok/tot*100):0;
  return '<div class="card">'
    + '<div class="bilan-pct">'+pct+'%</div>'
    + '<div class="center titre-mini" style="margin-bottom:14px">taux de réussite</div>'
    + '<div class="bilan-line"><span>Réponses justes</span><b style="color:var(--green)">'+score.ok+'</b></div>'
    + '<div class="bilan-line"><span>Erreurs</span><b style="color:var(--red)">'+score.ko+'</b></div>'
    + '<div class="bilan-line"><span>Total</span><b>'+tot+'</b></div>'
    + '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-o" onclick="score={ok:0,ko:0};render()">Remettre à zéro</button></div>'
    + '</div>';
}

initReglages(); initTabs(); render();
</script>
