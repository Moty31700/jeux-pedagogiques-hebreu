<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mishpatim, nouveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2a44; }

  .scene { position: relative; width: min(360px, 92vw); margin: 0 auto; padding-top: 44px; }
  .toile { position: relative; width: 100%; aspect-ratio: 523 / 543; }
  .toile img { position: absolute; display: block; pointer-events: none; user-select: none; }

  /* calques pleine taille */
  .plein { left: 0; top: 0; width: 100%; height: 100%; }

  /* le personnage saute ; la main et les traits suivent */
  .perso { position: absolute; inset: 0; transform-origin: 70.7% 97.6%;
           animation: saut 3.2s ease-in-out infinite; }
  .main  { left: 85.66%; top: 31.68%; width: 14.34%;
           transform-origin: 29% 94%; animation: geste 3.2s ease-in-out infinite; }
  .traits { animation: rayons 3.2s ease-in-out infinite; transform-origin: 75% 30%; }
  .sauts  { animation: impact 3.2s ease-in-out infinite; }

  /* lettres hébraïques qui s'envolent : מ ש פ ט י ם */
  .toile { container-type: inline-size; }
  .lettre { position: absolute; font-family: "Frank Ruhl Libre", "Times New Roman", serif; font-weight: 700;
            font-size: 9cqw; line-height: 1; color: #2a2118; opacity: 0;
            animation: envol 3.2s ease-out infinite; pointer-events: none; }
  .lettre.or { color: #b07a1c; }
  .l1 { left: 57%; top: 12%; animation-delay: 0s; }
  .l2 { left: 66%; top: 2%;  animation-delay: .53s; }
  .l3 { left: 76%; top: 8%;  animation-delay: 1.07s; }
  .l4 { left: 86%; top: 1%;  animation-delay: 1.6s; }
  .l5 { left: 90%; top: 15%; animation-delay: 2.13s; }
  .l6 { left: 61%; top: 22%; animation-delay: 2.67s; }

  @keyframes saut {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    8%  { transform: translateY(0) scale(1.03, .95); }
    22% { transform: translateY(-9%) scale(.98, 1.03) rotate(-2deg); }
    36% { transform: translateY(0) scale(1.04, .94); }
    44% { transform: translateY(0) scale(1, 1); }
    54% { transform: translateY(-4%) rotate(2deg); }
    64% { transform: translateY(0) scale(1.02, .97); }
    72% { transform: translateY(0) scale(1, 1); }
  }
  /* petits gestes de la main vers le bas : « par ici ! » */
  @keyframes geste {
    0%, 40%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(32deg); }
    58% { transform: rotate(4deg); }
    66% { transform: rotate(32deg); }
    74% { transform: rotate(4deg); }
    82% { transform: rotate(32deg); }
    90% { transform: rotate(0deg); }
  }
  @keyframes rayons {
    0%, 100% { opacity: .35; transform: scale(.94); }
    22%, 54% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes impact {
    0%, 30%, 100% { opacity: .25; }
    38%, 46% { opacity: 1; }
    66% { opacity: .9; }
  }
  @keyframes envol {
    0%   { opacity: 0; transform: translate(0, 30%) rotate(-8deg); }
    15%  { opacity: 1; }
    70%  { opacity: .9; }
    100% { opacity: 0; transform: translate(10%, -160%) rotate(10deg); }
  }

  /* bulle à gauche, dans l'espace libre du dessin */
  .bulle { position: absolute; left: 0; top: 30%; width: 46%;
           background: #fff; border: 2px solid #c8a24a; border-radius: 14px;
           padding: 10px 12px; font-size: clamp(12px, 3.6vw, 15px); line-height: 1.3;
           box-shadow: 0 2px 8px rgba(0,0,0,.08); text-decoration: none; color: inherit;
           animation: apparait .6s ease-out both; }
  .bulle::after { content: ""; position: absolute; right: -12px; top: 38%;
                  border: 6px solid transparent; border-left-color: #c8a24a; }
  .bulle b { display: block; color: #a8741a; font-size: 1.05em; margin-bottom: 2px; }

  .fleche { text-align: center; margin-top: 2px; font-size: 15px; color: #1f2a44; }
  .fleche a { color: inherit; text-decoration: none; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .chevron { width: 22px; height: 22px; animation: descend 1.6s ease-in-out infinite; }

  @keyframes descend {
    0%, 100% { transform: translateY(0); opacity: .5; }
    50% { transform: translateY(8px); opacity: 1; }
  }
  @keyframes apparait { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    /* animations réduites : la clé ne saute plus, mais la main et la flèche font encore signe */
    .perso, .traits, .sauts, .bulle { animation: none; }
    .lettre { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="toile">
      <img class="plein sauts" src="mascotte-sauts.png" alt="">
      <div class="perso">
        <img class="plein" src="mascotte-corps.png" alt="La clé de sol de Hebreu-zen, joyeuse">
        <img class="plein traits" src="mascotte-traits.png" alt="">
        <img class="main" src="mascotte-main.png" alt="">
      </div>
      <span class="lettre l1" lang="he">מ</span>
      <span class="lettre l2 or" lang="he">ש</span>
      <span class="lettre l3" lang="he">פ</span>
      <span class="lettre l4 or" lang="he">ט</span>
      <span class="lettre l5" lang="he">י</span>
      <span class="lettre l6 or" lang="he">ם</span>

      <a class="bulle" href="https://hebreu-zen.cloud/mon-compte" target="_top">
        <b>Nouveau !</b>
        Mishpatim, l'atelier de phrases en hébreu avec l'IA
      </a>
    </div>
    <div class="fleche">
      <a href="https://hebreu-zen.cloud/mon-compte" target="_top">
        Découvrez-le plus bas
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="#c8a24a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l7 7 7-7"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
