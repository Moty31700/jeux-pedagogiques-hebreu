<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poème — Fiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e4;      /* parchemin clair */
  --paper2:#fdfaf3;     /* carte plus claire */
  --ink:#2c2621;        /* encre chaude */
  --ink2:#5c5348;       /* gris chaud */
  --ink3:#8a7f70;
  --line:#d9cdb4;       /* filet */
  --gold:#a9803e;       /* bronze */
  --gold2:#c19a5b;
  --accent:#7a2e2e;     /* bordeaux discret pour titres de section */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Spectral',Georgia,serif;
  background:
    radial-gradient(ellipse at 12% 6%,rgba(169,128,62,.06) 0%,transparent 55%),
    radial-gradient(ellipse at 90% 96%,rgba(122,46,46,.05) 0%,transparent 55%),
    var(--paper);
  color:var(--ink);
  font-size:13pt;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:820px;margin:0 auto;padding:48px 40px 90px}

/* En-tête */
.head{text-align:center;margin-bottom:14px}
.kicker{font-family:'Spectral',serif;font-style:italic;color:var(--gold);font-size:12pt;letter-spacing:.5px;margin-bottom:6px}
.title-he{font-family:'Frank Ruhl Libre',serif;direction:rtl;font-weight:700;font-size:34pt;line-height:1.25;color:var(--ink)}
.title-fr{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22pt;color:var(--accent);margin-top:2px}
.author{font-family:'Spectral',serif;font-style:italic;color:var(--ink2);font-size:13pt;margin-top:4px}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--gold);margin:22px auto;max-width:340px}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.rule span{font-size:14pt;opacity:.7}

/* Analyse globale */
.intro{font-family:'Spectral',serif;font-size:13.5pt;line-height:1.85;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:4px;padding:22px 26px;margin:8px 0 38px}
.intro .lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15pt;
  color:var(--accent);letter-spacing:.5px;display:block;margin-bottom:8px}

/* Quatrains */
.section-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20pt;
  color:var(--accent);margin:34px 0 4px;text-align:center}
.section-sub{text-align:center;color:var(--ink3);font-style:italic;font-size:11.5pt;margin-bottom:22px}

.quatrain{margin:0 0 40px;padding:0 0 34px;border-bottom:1px solid var(--line)}
.quatrain:last-of-type{border-bottom:none}
.q-num{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);
  font-size:15pt;text-align:center;margin-bottom:14px}
.q-num::before,.q-num::after{content:'·';margin:0 10px;color:var(--gold2)}

.verse{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;
  font-size:22pt;line-height:2.05;font-weight:500;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-radius:4px;
  padding:20px 24px}

/* deux lignes vides entre hébreu et traduction (demande de Moty) */
.gap{height:2.4em}

.trans{font-family:'Spectral',serif;font-style:italic;direction:ltr;text-align:left;
  color:var(--ink2);font-size:13pt;line-height:1.7;padding:0 4px}

.analysis{font-family:'Spectral',serif;direction:ltr;text-align:left;
  font-size:13pt;line-height:1.85;color:var(--ink);margin-top:18px}
.analysis .lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13.5pt;
  color:var(--gold);letter-spacing:.4px;display:block;margin-bottom:4px}

/* Lexique */
.lex-wrap{margin-top:26px}
table.lex{width:100%;border-collapse:collapse;background:var(--paper2);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
table.lex caption{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:18pt;
  color:var(--accent);text-align:center;padding:14px 0 4px;caption-side:top}
table.lex th,table.lex td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5pt}
table.lex th{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.6px;font-size:11pt;text-align:left}
table.lex td.he{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;
  font-size:17pt;font-weight:500;white-space:nowrap}
table.lex td.tr{font-style:italic;color:var(--ink2)}
table.lex tr:last-child td{border-bottom:none}

.copyright{margin:44px auto 0;padding-top:16px;border-top:1px solid var(--line);
  text-align:center;font-family:'Spectral',serif;font-size:10.5pt;color:var(--ink3);font-style:italic}

.empty{text-align:center;color:var(--ink3);padding:60px 20px;font-style:italic;font-size:13pt}
.empty .mark{font-size:34pt;color:var(--gold);display:block;margin-bottom:10px}

@media print{
  body{background:#fff}
  .sheet{max-width:none;padding:0}
  .intro,.verse,table.lex{background:#fff}
  .quatrain{page-break-inside:avoid}
}
@media(max-width:560px){
  .sheet{padding:30px 18px 70px}
  .title-he{font-size:27pt}.title-fr{font-size:18pt}
  .verse{font-size:19pt}
  body{font-size:12.5pt}
}
</style>

const JEU = {"titre":"כוכבים בחוץ: שירים","auteur":"נתן אלתרמן","youtube":"","shironet":"","mots":[{"heb":"נִגּוּן","translit":"niggún","fr":"mélodie, air musical","sens":"nom masculin singulier","racine":"נ-ג-נ","nature":"nom","genre":"m","nombre":"sg","formes":"נִגּוּנִים","cat":"noms","emploi":"הַנִּגּוּן שֶׁזָּנַחְתָּ לַשָּׁוְא — la mélodie que tu as abandonnée en vain."},{"heb":"זָנַחְתָּ","translit":"zanákhta","fr":"tu as abandonné, tu as délaissé","sens":"qal, passé, 2e pers. masc. sg.","racine":"ז-נ-ח","nature":"verbe","genre":"m","nombre":"sg","formes":"זוֹנֵחַ · יִזְנַח","cat":"verbes","emploi":"זָנַחְתָּ אֶת הַנִּגּוּן — tu as abandonné la mélodie."},{"heb":"לַשָּׁוְא","translit":"lashav","fr":"en vain, inutilement","sens":"préposition ל + nom masc. sg. construit","racine":"ש-ו-א","nature":"adverbe","genre":"—","nombre":"—","formes":"שָׁוְא","cat":"autre","emploi":"עָמַלְתָּ לַשָּׁוְא — tu as peiné en vain."},{"heb":"נִפְקַחַת","translit":"nifkákhat","fr":"s'ouvre, se déploie (comme des yeux qui s'ouvrent)","sens":"nifal, présent, fém. sg.","racine":"פ-ק-ח","nature":"verbe","genre":"f","nombre":"sg","formes":"פָּקַח · נִפְקַח","cat":"verbes","emploi":"הַדֶּרֶךְ נִפְקַחַת לָאֹרֶךְ — la route s'ouvre en longueur."},{"heb":"עוֹבֵר אוֹרַח","translit":"ovér órakhe","fr":"voyageur de passage, passant","sens":"participe qal masc. sg. + nom masc. sg.","racine":"ע-ב-ר / א-ר-ח","nature":"expression","genre":"m","nombre":"sg","formes":"אוֹרְחִים עוֹבְרִים","cat":"autre","emploi":"הוּא עוֹבֵר אוֹרַח בַּכְּפָר — il est un voyageur de passage dans le village."},{"heb":"טִיסַת נַדְנֵדוֹת","translit":"tisat nadnedót","fr":"vol de balançoires","sens":"nom fém. sg. construit + nom fém. pl.","racine":"ט-ו-ס / נ-ד-נ-ד","nature":"expression","genre":"f","nombre":"pl (noms)","formes":"טִיסָה · נַדְנֵדָה","cat":"autre","emploi":"הַבְּרָקִים עוֹבְרִים בְּטִיסַת נַדְנֵדוֹת — les éclairs passent en vol de balançoires."},{"heb":"עֵדוֹת","translit":"edót","fr":"témoins (féminin pluriel)","sens":"nom fém. pl.","racine":"ע-ו-ד","nature":"nom","genre":"f","nombre":"pl","formes":"עֵד · עֵדִים","cat":"noms","emploi":"הַכִּבְשָׂה וְהָאַיֶּלֶת הָיוּ עֵדוֹת — la brebis et la biche furent témoins."},{"heb":"לִטַּף","translit":"littéf","fr":"caresser","sens":"piel, infinitif / passé 2e pers. masc. sg.: לִטַּפְתָּ","racine":"ל-ט-פ","nature":"verbe","genre":"m","nombre":"sg","formes":"מְלַטֵּף · לִטּוּף","cat":"verbes","emploi":"לִטַּפְתָּ אֶת הַכֶּלֶב בְּעָדִינוּת — tu as caressé le chien avec douceur."},{"heb":"סָגַדְתָּ אַפַּיִם","translit":"sagádeta appáyim","fr":"tu t'es prosterné face contre terre","sens":"qal passé 2e masc. sg. + nom duel masc.","racine":"ס-ג-ד / א-פ-י-מ","nature":"expression","genre":"m","nombre":"sg (verbe)","formes":"סָגַד · אַפַּיִם","cat":"autre","emploi":"סָגַדְתָּ אַפַּיִם לִפְנֵי הַיֹּפִי — tu t'es prosterné devant la beauté."},{"heb":"חֹרְשָׁה","translit":"khórsha","fr":"bosquet, petit bois","sens":"nom fém. sg.","racine":"ח-ר-ש","nature":"nom","genre":"f","nombre":"sg","formes":"חֳרָשִׁים","cat":"noms","emploi":"יָשַׁבְנוּ בְּצֵל הַחֹרְשָׁה — nous nous sommes assis à l'ombre du bosquet."},{"heb":"צַמֶּרֶת","translit":"tsámeret","fr":"cime d'un arbre, sommet feuillu","sens":"nom fém. sg.","racine":"צ-מ-ר","nature":"nom","genre":"f","nombre":"sg","formes":"צַמֶּרֶת","cat":"noms","emploi":"הָעוֹרֵב יָשַׁב עַל הַצַּמֶּרֶת — le corbeau s'est posé sur la cime."},{"heb":"גְּשׁוּמַת עַפְעַפַּיִם","translit":"geshumat afapáyim","fr":"aux paupières trempées de pluie","sens":"adj fém. sg. construit + nom masc. duel","racine":"ג-ש-מ / ע-פ-ע-פ","nature":"expression","genre":"f","nombre":"sg","formes":"גָּשׁוּם · עַפְעַף","cat":"autre","emploi":"הַצַּמֶּרֶת גְּשׁוּמַת עַפְעַפַּיִם — la cime aux paupières trempées de pluie (métaphore)."},{"heb":"יָדֶיךָ רֵיקוֹת","translit":"yadékha reikót","fr":"tes mains sont vides","sens":"nom fém. du. construit + 2e sg. masc. / adj fém. pl.","racine":"י-ד / ר-י-ק","nature":"expression","genre":"f","nombre":"pl","formes":"יָד · רֵיק","cat":"autre","emploi":"שָׁב הַבַּיְתָה כְּשֶׁיָּדָיו רֵיקוֹת — il est rentré les mains vides."},{"heb":"הוֹסַפְתָּ לֶכֶת","translit":"hosáfta lékhet","fr":"tu as continué de marcher, tu as repris ta marche","sens":"hifil passé 2e masc. sg. + infinitif qal","racine":"י-ס-פ / ה-ל-כ","nature":"expression","genre":"m","nombre":"sg","formes":"הוֹסִיף · לָלֶכֶת","cat":"autre","emploi":"לִטַּפְתָּ אֶת הַחַיּוֹת וְהוֹסַפְתָּ לֶכֶת — tu as caressé les animaux et tu as continué de marcher."},{"heb":"עוֹד","translit":"od","fr":"encore, toujours","sens":"adverbe","racine":"ע-ו-ד","nature":"adverbe","genre":"—","nombre":"—","formes":"עוֹדֶנּוּ","cat":"autre","emploi":"עוֹד חוֹזֵר הַנִּגּוּן — la mélodie revient encore."}],"phrases":[{"heb":"עוֹד חוֹזֵר הַנִּגּוּן שֶׁזָּנַחְתָּ לַשָּׁוְא","fr":"La mélodie que tu as abandonnée en vain revient encore"},{"heb":"עוֹד חוֹזֵר הַנִּגּוּן שֶׁזָּנַחְתָּ לַשָּׁוְא","fr":"La mélodie que tu as abandonnée en vain revient encore"},{"heb":"עוֹד חוֹזֵר הַנִּגּוּן שֶׁזָּנַחְתָּ לַשָּׁוְא","fr":"La mélodie que tu as abandonnée en vain revient encore"},{"heb":"וְהַדֶּרֶךְ עוֹדֶנָּה נִפְקַחַת לָאֹרֶךְ","fr":"et la route s'ouvre toujours en longueur"},{"heb":"מְצַפִּים עוֹד לְךָ, עוֹבֵר אוֹרַח","fr":"attendent encore ton passage, voyageur de passage"},{"heb":"וּבְטִיסַת נַדְנֵדוֹת יַעַבְרוּ הַבְּרָקִים מֵעָלֶיךָ","fr":"et dans un vol de balançoires les éclairs passeront au-dessus de toi"},{"heb":"וְכִבְשָׂה וְאַיֶּלֶת תִּהְיֶינָה עֵדוֹת","fr":"et une brebis et une biche seront témoins"},{"heb":"שֶׁלִּטַּפְתָּ אוֹתָן וְהוֹסַפְתָּ לֶכֶת","fr":"que tu les as caressées et as continué de marcher"},{"heb":"וְלֹא פַּעַם סָגַדְתָּ אַפַּיִם","fr":"et que plus d'une fois tu t'es prosterné face contre terre"},{"heb":"לְחֹרְשָׁה יְרוֹקָה וְאִשָּׁה בִּצְחוֹקָהּ","fr":"devant un bosquet verdoyant et une femme dans son rire"},{"heb":"וְצַמֶּרֶת גְּשׁוּמַת עַפְעַפַּיִם","fr":"et une cime trempée de pluie aux paupières closes"},{"heb":"וְצַמֶּרֶת גְּשׁוּמַת עַפְעַפַּיִם","fr":"et une cime trempée de pluie aux paupières closes"},{"heb":"שֶׁיָּדֶיךָ רֵיקוֹת וְעִירְךָ רְחוֹקָה","fr":"que tes mains sont vides et ta ville lointaine"},{"heb":"שֶׁלִּטַּפְתָּ אוֹתָן וְהוֹסַפְתָּ לֶכֶת","fr":"que tu les as caressées et as continué de marcher"},{"heb":"עוֹד חוֹזֵר הַנִּגּוּן שֶׁזָּנַחְתָּ לַשָּׁוְא","fr":"La mélodie que tu as abandonnée en vain revient encore"}],"quatrains":[{"heb":"עוֹד חוֹזֵר הַנִּגּוּן שֶׁזָּנַחְתָּ לַשָּׁוְא\nוְהַדֶּרֶךְ עוֹדֶנָּה נִפְקַחַת לָאֹרֶךְ\nוְעָנָן בְּשָׁמָיו וְאִילָן בִּגְשָׁמָיו\nמְצַפִּים עוֹד לְךָ, עוֹבֵר אוֹרַח.","fr":"La mélodie que tu as abandonnée en vain revient encore,\net la route s'ouvre toujours en longueur,\net un nuage dans ses cieux et un arbre dans ses pluies\nattendent encore ton passage, voyageur de passage.","an":"Ce quatrain d'ouverture installe d'emblée le motif central: le retour inexorable de ce que l'on croit avoir fui. Le verbe 'עוֹד חוֹזֵר' (revient encore) souligne une répétition cyclique malgré la volonté de rupture exprimée par 'שֶׁזָּנַחְתָּ לַשָּׁוְא' (que tu as abandonné en vain). L'adverbe 'לַשָּׁוְא' est douloureux: l'abandon était inutile, la mélodie — métaphore de la sensibilité poétique ou affective — persiste. La route qui 'se déploie' (נִפְקַחַת, au sens de 's'ouvre comme des yeux') anthropomorphise l'espace: il accueille, il attend. La symétrie syntaxique du troisième vers — nuage/cieux, arbre/pluies — crée un équilibre visuel qui souligne l'harmonie de la nature face à l'agitation humaine. Le dernier terme, 'עוֹבֵר אוֹרַח' (passant, voyageur de passage), est une apposition distancée, comme si le poète nommait l'autre — ou lui-même — avec une légère ironie tendre."},{"heb":"וְהָרוּחַ תָּקוּם וּבְטִיסַת נַדְנֵדוֹת\nיַעַבְרוּ הַבְּרָקִים מֵעָלֶיךָ\nוְכִבְשָׂה וְאַיֶּלֶת תִּהְיֶינָה עֵדוֹת\nשֶׁלִּטַּפְתָּ אוֹתָן וְהוֹסַפְתָּ לֶכֶת – –","fr":"Et le vent se lèvera et dans un vol de balançoires\nles éclairs passeront au-dessus de toi,\net une brebis et une biche seront témoins\nque tu les as caressées et as continué de marcher — —","an":"Ce quatrain est celui du mouvement et de l'éphémère. L'image des éclairs qui passent 'en vol de balançoires' (בְּטִיסַת נַדְנֵדוֹת) est saisissante: la comparaison inattendue entre la foudre et le jeu enfantin de la balançoire crée un effet surréaliste, mêlant danger et légèreté, grandeur cosmique et intimité ludique. La nature est encore personnifiée: la brebis et la biche deviennent des 'témoins' (עֵדוֹת), terme juridique et solennel, qui confère une gravité presque rituelle à un geste simple — la caresse. Le tiret double final (– –) est une suspension poétique remarquable: la phrase reste ouverte, mimant l'inachèvement du voyage, l'impossibilité de se fixer. La syntaxe subordonnée ('שֶׁלִּטַּפְתָּ... וְהוֹסַפְתָּ') accentue la dualité fondamentale: toucher puis repartir, aimer sans rester."},{"heb":"– – שֶׁיָּדֶיךָ רֵיקוֹת וְעִירְךָ רְחוֹקָה\nוְלֹא פַּעַם סָגַדְתָּ אַפַּיִם\nלְחֹרְשָׁה יְרוֹקָה וְאִשָּׁה בִּצְחוֹקָהּ\nוְצַמֶּרֶת גְּשׁוּמַת עַפְעַפַּיִם.","fr":"— — que tes mains sont vides et ta ville lointaine,\net que plus d'une fois tu t'es prosterné face contre terre\ndevant un bosquet verdoyant et une femme dans son rire\net une cime trempée de pluie aux paupières closes.","an":"Ce quatrain final est le plus dense émotionnellement et syntaxiquement: il continue directement la subordinée du quatrain précédent (reprise des tirets doubles), créant une longue période qui souligne l'accumulation des attachements impossibles. 'יָדֶיךָ רֵיקוֹת' (tes mains vides) est l'image centrale de la dépossession volontaire ou subie: le voyageur ne retient rien. 'סָגַדְתָּ אַפַּיִם' — se prosterner face contre terre — est un geste de prière ou d'adoration profonde, appliqué non à Dieu mais à la nature et à la femme: sacralisation du monde sensible. La triade finale — bosquet vert, femme riante, cime aux paupières de pluie — est une énumération lyrique de beautés fugaces. L'expression 'גְּשׁוּמַת עַפְעַפַּיִם' (aux paupières trempées de pluie) est une métaphore anthropomorphique audacieuse: l'arbre devient visage, la pluie devient larmes ou sommeil, achevant le poème sur une image de douceur mélancolique et de clôture."}],"analyse":"Nathan Alterman (1910-1970), poète majeur de la littérature hébraïque moderne, publie 'כּוֹכָבִים בַּחוּץ' (Étoiles dehors) en 1938. Ce recueil, emblématique du modernisme hébraïque, mêle symbolisme, surréalisme et lyrisme romantique. Le poème ici étudié explore la tension entre le mouvement perpétuel du voyageur et son attachement nostalgique au monde qu'il traverse sans jamais s'y arrêter. La nature — vent, pluie, éclairs, animaux — est témoin silencieux d'une errance intérieure. La forme en quatrains à rimes croisées, le registre soutenu et les images sensorielles fortes construisent un portrait de l'homme moderne: solitaire, les mains vides, la ville lointaine, mais sans cesse tenté par la beauté du monde. Le poème oscille entre mélancolie et émerveillement, entre fuite et désir d'appartenance."};
/* ↑ VIDE en production — l'IA remplit titre/auteur/analyse/quatrains/mots. */

const NIKOUD=/[\u0591-\u05C7]/g;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function br(s){return esc(s).split('\n').join('<br>');}

function render(){
  const el=document.getElementById('sheet');
  if(!JEU.quatrains || !JEU.quatrains.length){
    el.innerHTML='<div class="empty"><span class="mark">✦</span>En attente du poème.<br>La fiche se remplit dès que la leçon est générée.</div>';
    return;
  }
  let h='';
  h+='<div class="head">';
  h+='<div class="kicker">Fiche de lecture — poésie hébraïque</div>';
  h+='<div class="title-he">'+esc(JEU.titre||'שיר')+'</div>';
  if(JEU.auteur) h+='<div class="author">'+esc(JEU.auteur)+'</div>';
  h+='</div>';
  h+='<div class="rule"><span>✦</span></div>';

  if(JEU.analyse){
    h+='<div class="intro"><span class="lbl">Vue d\u2019ensemble</span>'+br(JEU.analyse)+'</div>';
  }

  h+='<div class="section-title">Le poème, quatrain par quatrain</div>';
  h+='<div class="section-sub">texte · traduction · analyse</div>';

  JEU.quatrains.forEach(function(q,i){
    h+='<div class="quatrain">';
    h+='<div class="q-num">Quatrain '+(i+1)+'</div>';
    h+='<div class="verse">'+br(q.heb)+'</div>';
    h+='<div class="gap"></div>';
    h+='<div class="trans">'+br(q.fr)+'</div>';
    if(q.an){ h+='<div class="analysis"><span class="lbl">Analyse</span>'+br(q.an)+'</div>'; }
    h+='</div>';
  });

  if(JEU.mots && JEU.mots.length){
    h+='<div class="lex-wrap"><table class="lex"><caption>Lexique</caption>';
    h+='<tr><th>Hébreu</th><th>Translittération</th><th>Français</th></tr>';
    JEU.mots.forEach(function(m){
      h+='<tr><td class="he">'+esc(m.heb||m.h||'')+'</td><td class="tr">'+esc(m.translit||m.t||'')+'</td><td>'+esc(m.fr||m.f||'')+'</td></tr>';
    });
    h+='</table></div>';
  }

  h+='<div class="copyright">© 2026 hebreu-zen — Toutes reproductions interdites et réservées</div>';
  el.innerHTML=h;
}
render();
</script>
