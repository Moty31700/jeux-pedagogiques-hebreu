<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poème — Fiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e4;      /* parchemin clair */
  --paper2:#fdfaf3;     /* carte plus claire */
  --ink:#2c2621;        /* encre chaude */
  --ink2:#5c5348;       /* gris chaud */
  --ink3:#8a7f70;
  --line:#d9cdb4;       /* filet */
  --gold:#a9803e;       /* bronze */
  --gold2:#c19a5b;
  --accent:#7a2e2e;     /* bordeaux discret pour titres de section */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Spectral',Georgia,serif;
  background:
    radial-gradient(ellipse at 12% 6%,rgba(169,128,62,.06) 0%,transparent 55%),
    radial-gradient(ellipse at 90% 96%,rgba(122,46,46,.05) 0%,transparent 55%),
    var(--paper);
  color:var(--ink);
  font-size:13pt;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:820px;margin:0 auto;padding:48px 40px 90px}

/* En-tête */
.head{text-align:center;margin-bottom:14px}
.kicker{font-family:'Spectral',serif;font-style:italic;color:var(--gold);font-size:12pt;letter-spacing:.5px;margin-bottom:6px}
.title-he{font-family:'Frank Ruhl Libre',serif;direction:rtl;font-weight:700;font-size:34pt;line-height:1.25;color:var(--ink)}
.title-fr{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22pt;color:var(--accent);margin-top:2px}
.author{font-family:'Spectral',serif;font-style:italic;color:var(--ink2);font-size:13pt;margin-top:4px}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--gold);margin:22px auto;max-width:340px}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.rule span{font-size:14pt;opacity:.7}

/* Analyse globale */
.intro{font-family:'Spectral',serif;font-size:13.5pt;line-height:1.85;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:4px;padding:22px 26px;margin:8px 0 38px}
.intro .lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15pt;
  color:var(--accent);letter-spacing:.5px;display:block;margin-bottom:8px}

/* Quatrains */
.section-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20pt;
  color:var(--accent);margin:34px 0 4px;text-align:center}
.section-sub{text-align:center;color:var(--ink3);font-style:italic;font-size:11.5pt;margin-bottom:22px}

.quatrain{margin:0 0 40px;padding:0 0 34px;border-bottom:1px solid var(--line)}
.quatrain:last-of-type{border-bottom:none}
.q-num{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);
  font-size:15pt;text-align:center;margin-bottom:14px}
.q-num::before,.q-num::after{content:'·';margin:0 10px;color:var(--gold2)}

.verse{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;
  font-size:22pt;line-height:2.05;font-weight:500;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-radius:4px;
  padding:20px 24px}

/* deux lignes vides entre hébreu et traduction (demande de Moty) */
.gap{height:2.4em}

.trans{font-family:'Spectral',serif;font-style:italic;direction:ltr;text-align:left;
  color:var(--ink2);font-size:13pt;line-height:1.7;padding:0 4px}

.analysis{font-family:'Spectral',serif;direction:ltr;text-align:left;
  font-size:13pt;line-height:1.85;color:var(--ink);margin-top:18px}
.analysis .lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13.5pt;
  color:var(--gold);letter-spacing:.4px;display:block;margin-bottom:4px}

/* Lexique */
.lex-wrap{margin-top:26px}
table.lex{width:100%;border-collapse:collapse;background:var(--paper2);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
table.lex caption{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:18pt;
  color:var(--accent);text-align:center;padding:14px 0 4px;caption-side:top}
table.lex th,table.lex td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5pt}
table.lex th{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.6px;font-size:11pt;text-align:left}
table.lex td.he{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;
  font-size:17pt;font-weight:500;white-space:nowrap}
table.lex td.tr{font-style:italic;color:var(--ink2)}
table.lex tr:last-child td{border-bottom:none}

.copyright{margin:44px auto 0;padding-top:16px;border-top:1px solid var(--line);
  text-align:center;font-family:'Spectral',serif;font-size:10.5pt;color:var(--ink3);font-style:italic}

.empty{text-align:center;color:var(--ink3);padding:60px 20px;font-style:italic;font-size:13pt}
.empty .mark{font-size:34pt;color:var(--gold);display:block;margin-bottom:10px}

@media print{
  body{background:#fff}
  .sheet{max-width:none;padding:0}
  .intro,.verse,table.lex{background:#fff}
  .quatrain{page-break-inside:avoid}
}
@media(max-width:560px){
  .sheet{padding:30px 18px 70px}
  .title-he{font-size:27pt}.title-fr{font-size:18pt}
  .verse{font-size:19pt}
  body{font-size:12.5pt}
}
</style>
</head>

<script>

const JEU = {"titre":"להיות עם חופשי","auteur":"Revital Berger Shloman","youtube":"","shironet":"","mots":[{"heb":"אַרְצִי","translit":"artsi","fr":"ma terre / mon pays","sens":"nom féminin singulier + suffixe possessif 1ps","racine":"א-ר-ץ","nature":"nom","genre":"f","nombre":"sg","formes":"אֶרֶץ · אַרְצִי · אַרְצְךָ · אֲרָצוֹת","cat":"noms","emploi":"אַרְצִי הִיא יִשְׂרָאֵל — ma terre c'est Israël."},{"heb":"מוֹלַדְתִּי","translit":"moladti","fr":"ma patrie / ma terre natale","sens":"nom féminin singulier + suffixe possessif 1ps","racine":"י-ל-ד","nature":"nom","genre":"f","nombre":"sg","formes":"מוֹלֶדֶת · מוֹלַדְתִּי · מוֹלַדְתּוֹ","cat":"noms","emploi":"מוֹלַדְתִּי הִיא הַמָּקוֹם שֶׁנּוֹלַדְתִּי בּוֹ — ma patrie est l'endroit où je suis née."},{"heb":"מִתְעוֹרֶרֶת","translit":"mit'orerevet","fr":"tu t'éveilles / tu te réveilles","sens":"hitpa'el participe féminin singulier / présent 2fs","racine":"ע-ו-ר","nature":"verbe","genre":"f","nombre":"sg","formes":"עוּר · הִתְעוֹרֵר · מִתְעוֹרֵר · מִתְעוֹרֶרֶת","cat":"verbes","emploi":"הָאָרֶץ מִתְעוֹרֶרֶת לְחַיִּים חֲדָשִׁים — le pays s'éveille à une vie nouvelle."},{"heb":"מִשְׁתַּחְרֶרֶת","translit":"mishtaḥreret","fr":"tu te libères","sens":"hitpa'el participe féminin singulier / présent 2fs","racine":"ח-ר-ר","nature":"verbe","genre":"f","nombre":"sg","formes":"חֵרוּת · שִׁחְרֵר · מִשְׁתַּחְרֵר · מִשְׁתַּחְרֶרֶת","cat":"verbes","emploi":"הָעָם מִשְׁתַּחְרֵר מֵהַכִּבּוּשׁ — le peuple se libère de l'occupation."},{"heb":"עוֹד מְעַט","translit":"od me'at","fr":"encore un peu / bientôt","sens":"locution adverbiale temporelle","racine":"ע-ו-ד / מ-ע-ט","nature":"expression","genre":"—","nombre":"—","formes":"עוֹד · מְעַט","cat":"autre","emploi":"עוֹד מְעַט יַגִּיעַ הָאָבִיב — bientôt le printemps arrivera."},{"heb":"וְתִהְיִי אַחֶרֶת","translit":"vetihi aḥeret","fr":"et tu seras autre / différente","sens":"conjonction + futur qal 2fs + adjectif fs","racine":"ה-י-ה / א-ח-ר","nature":"expression","genre":"f","nombre":"sg","formes":"תִּהְיִי · אַחֶרֶת","cat":"autre","emploi":"אַחֲרֵי הַמִּלְחָמָה תִּהְיִי אַחֶרֶת — après la guerre tu seras différente."},{"heb":"סוֹעֶרֶת","translit":"so'eret","fr":"tu tempêtes / tu es en tempête","sens":"qal participe féminin singulier","racine":"ס-ע-ר","nature":"verbe","genre":"f","nombre":"sg","formes":"סָעַר · סוֹעֵר · סוֹעֶרֶת · סַעַר","cat":"verbes","emploi":"הַיָּם סוֹעֵר בַּחוֹרֶף — la mer est en tempête en hiver."},{"heb":"תָּמִיד","translit":"tamid","fr":"toujours / en permanence","sens":"adverbe de temps","racine":"ת-מ-ד","nature":"adverbe","genre":"—","nombre":"—","formes":"תָּמִיד","cat":"autre","emploi":"הוּא תָּמִיד חוֹשֵׁב עַל הָאָרֶץ — il pense toujours à la terre."},{"heb":"אַדְמָתְךָ","translit":"admatekha","fr":"ta terre / ton sol","sens":"nom féminin singulier + suffixe possessif 2ms","racine":"א-ד-מ","nature":"nom","genre":"f","nombre":"sg","formes":"אֲדָמָה · אַדְמָתִי · אַדְמָתְךָ · אֲדָמוֹת","cat":"noms","emploi":"אַדְמָתְךָ קְדוֹשָׁה לְךָ — ta terre t'est sacrée."},{"heb":"בּוֹעֶרֶת","translit":"bo'eret","fr":"elle brûle / est en feu","sens":"qal participe féminin singulier","racine":"ב-ע-ר","nature":"verbe","genre":"f","nombre":"sg","formes":"בָּעַר · בּוֹעֵר · בּוֹעֶרֶת","cat":"verbes","emploi":"הַיַּעַר בּוֹעֵר מֵחֹם הַקַּיִץ — la forêt brûle sous la chaleur de l'été."},{"heb":"שְׂפָתַי","translit":"sefatai","fr":"mes lèvres","sens":"nom féminin duel + suffixe possessif 1ps","racine":"ש-פ-ה","nature":"nom","genre":"f","nombre":"du","formes":"שָׂפָה · שְׂפָתַיִם · שְׂפָתַי","cat":"noms","emploi":"שְׂפָתַי מְדַבְּרוֹת תְּפִלָּה — mes lèvres prononcent une prière."},{"heb":"מְדַבֶּרֶת","translit":"medaberet","fr":"tu parles / elle parle","sens":"pi'el participe féminin singulier / présent 2fs ou 3fs","racine":"ד-ב-ר","nature":"verbe","genre":"f","nombre":"sg","formes":"דִּבֵּר · מְדַבֵּר · מְדַבֶּרֶת · דָּבַר","cat":"verbes","emploi":"הִיא מְדַבֶּרֶת בְּקוֹל רָם — elle parle à voix haute."},{"heb":"תְּפִלָּה","translit":"tefila","fr":"prière","sens":"nom féminin singulier absolu","racine":"פ-ל-ל","nature":"nom","genre":"f","nombre":"sg","formes":"תְּפִלָּה · תְּפִלּוֹת · הִתְפַּלֵּל","cat":"noms","emploi":"הַשִּׁיר הוּא תְּפִלָּה אַחַת — le poème est une seule prière."},{"heb":"מְשׁוֹרֶרֶת","translit":"meshoreret","fr":"poétesse","sens":"nom féminin singulier, dérivé de pi'el participe","racine":"ש-י-ר","nature":"nom","genre":"f","nombre":"sg","formes":"מְשׁוֹרֵר · מְשׁוֹרֶרֶת · שִׁיר · שִׁירָה","cat":"noms","emploi":"הִיא מְשׁוֹרֶרֶת יִשְׂרְאֵלִית — elle est une poétesse israélienne."},{"heb":"גַּם אִם","translit":"gam im","fr":"même si","sens":"locution conjonctive concessive","racine":"ג-מ / א-מ","nature":"conjonction","genre":"—","nombre":"—","formes":"גַּם · אִם","cat":"autre","emploi":"גַּם אִם הַדֶּרֶךְ קָשָׁה, נִמְשִׁיךְ — même si le chemin est dur, nous continuerons."}],"phrases":[{"heb":"אַרְצִי. מוֹלַדְתִּי","fr":"Ma terre. Ma patrie"},{"heb":"אַרְצִי. מוֹלַדְתִּי","fr":"Ma terre. Ma patrie"},{"heb":"אַתְּ מִתְעוֹרֶרֶת","fr":"Tu t'éveilles"},{"heb":"מִשְׁתַּחְרֶרֶת","fr":"Tu te libères"},{"heb":"עוֹד מְעַט","fr":"Encore un peu"},{"heb":"וְתִהְיִי אַחֶרֶת","fr":"Et tu seras autre"},{"heb":"בְּלִבִּי תָּמִיד סוֹעֶרֶת","fr":"Dans mon cœur tu tempêtes toujours"},{"heb":"בְּלִבִּי תָּמִיד סוֹעֶרֶת","fr":"Dans mon cœur tu tempêtes toujours"},{"heb":"גַּם אִם אַדְמָתְךָ בּוֹעֶרֶת","fr":"Même si ta terre brûle"},{"heb":"גַּם אִם אַדְמָתְךָ בּוֹעֶרֶת","fr":"Même si ta terre brûle"},{"heb":"אֶת שְׂפָתַי מְדַבֶּרֶת","fr":"Tu parles mes lèvres"},{"heb":"אֶת שְׂפָתַי מְדַבֶּרֶת","fr":"Tu parles mes lèvres"},{"heb":"בִּתְפִלָּה אַחַת","fr":"En une seule prière"},{"heb":"שֶׁל מְשׁוֹרֶרֶת","fr":"De poétesse"},{"heb":"גַּם אִם אַדְמָתְךָ בּוֹעֶרֶת","fr":"Même si ta terre brûle"}],"quatrains":[{"heb":"אַרְצִי. מוֹלַדְתִּי\nאַתְּ מִתְעוֹרֶרֶת\nמִשְׁתַּחְרֶרֶת\nעוֹד מְעַט\nוְתִהְיִי אַחֶרֶת","fr":"Ma terre. Ma patrie\nTu t'éveilles\nTu te libères\nEncore un peu\nEt tu seras autre","an":"Le poème s'ouvre sur une double apostrophe nominale — 'אַרְצִי. מוֹלַדְתִּי' — deux substantifs au suffixe de première personne du singulier, séparés par un point, créant un rythme haché, presque une respiration retenue. La patrie est féminisée grammaticalement et affectivement : le pronom 'אַתְּ' convoque une interlocutrice intime. Les deux participes 'מִתְעוֹרֶרֶת' et 'מִשְׁתַּחְרֶרֶת' — formes hitpa'el — expriment une action réflexive, progressive, intérieure : la terre se réveille d'elle-même, se libère par sa propre force. L'expression temporelle 'עוֹד מְעַט' suspend l'action dans un futur proche, presque messianique. Le vers final 'וְתִהְיִי אַחֶרֶת' — futur du verbe הָיָה — promet une métamorphose sans la définir, laissant ouverte la nature de cette altérité. Le registre est prophétique, intime, porteur d'une espérance fragile mais affirmée."},{"heb":"בְּלִבִּי תָּמִיד סוֹעֶרֶת\nגַּם אִם אַדְמָתְךָ בּוֹעֶרֶת","fr":"Dans mon cœur tu tempêtes toujours\nMême si ta terre brûle","an":"Ce distique pivot opère un basculement : on passe de l'apostrophe de la patrie à l'aveu du sujet lyrique. 'בְּלִבִּי תָּמִיד סוֹעֶרֶת' place la patrie à l'intérieur du corps de la poétesse — elle est la tempête elle-même, 'סוֹעֶרֶת' (participe qal féminin de סָעַר, tempêter), un état permanent signifié par 'תָּמִיד'. La rime interne entre 'סוֹעֶרֶת' et 'בּוֹעֶרֶת' crée un effet phonique saisissant : la tourmente intérieure fait écho à l'incendie extérieur. Le passage du pronom féminin 'אַתְּ' au suffixe masculin 'אַדְמָתְךָ' est grammaticalement notable — peut-être un glissement vers un destinataire collectif, le peuple ou la nation au sens abstrait. La conjonction 'גַּם אִם' introduit la concession : l'amour et la foi résistent même à la catastrophe. Le registre monte en intensité dramatique."},{"heb":"אֶת שְׂפָתַי מְדַבֶּרֶת\nבִּתְפִלָּה אַחַת\nשֶׁל מְשׁוֹרֶרֶת","fr":"Tu parles mes lèvres\nEn une seule prière\nDe poétesse","an":"La clôture du poème est la plus audacieuse syntaxiquement. 'אֶת שְׂפָתַי מְדַבֶּרֶת' est une construction rare et poétiquement forte : la patrie parle les lèvres de la poétesse, non pas par elles — elle les possède, elle est leur voix. Le verbe דִּבֵּר avec l'accusatif direct d'un organe corporel évoque un usage biblique et mystique : c'est la terre qui parle à travers l'être humain, inversion du rapport ordinaire. 'בִּתְפִלָּה אַחַת' — une seule prière — concentre toute l'ambition poétique en un acte liturgique unique. Le dernier mot, 'מְשׁוֹרֶרֶת' (poétesse, féminin de מְשׁוֹרֵר), est une révélation identitaire : la locutrice se nomme enfin, se situe dans une tradition de voix féminines et poétiques. Le poème entier devient ainsi cette prière unique. Le registre est mystique, humble et souverain à la fois."}],"analyse":"Revital Berger Shloman compose ici un poème lyrique et politique d'une grande intensité, où la patrie est apostrophée comme une femme en éveil, traversant une crise mais promise à la renaissance. La forme est organique : neuf vers à rime unique en -eret, créant un effet d'incantation, de litanie presque liturgique. Le titre 'לִהְיוֹת עַם חׇפְשִׁי' (être un peuple libre) résonne avec HaTikvah, l'hymne national israélien, ancrant le poème dans la mémoire collective. La poétesse joue sur l'ambiguïté entre espoir et douleur : la terre brûle, mais la prière persiste. Le registre est élevé, biblique par endroits, intime par le recours au 'moi' lyrique."};
/* ↑ VIDE en production — l'IA remplit titre/auteur/analyse/quatrains/mots. */

const NIKOUD=/[\u0591-\u05C7]/g;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function br(s){return esc(s).split('\n').join('<br>');}

function render(){
  const el=document.getElementById('sheet');
  if(!JEU.quatrains || !JEU.quatrains.length){
    el.innerHTML='<div class="empty"><span class="mark">✦</span>En attente du poème.<br>La fiche se remplit dès que la leçon est générée.</div>';
    return;
  }
  let h='';
  h+='<div class="head">';
  h+='<div class="kicker">Fiche de lecture — poésie hébraïque</div>';
  h+='<div class="title-he">'+esc(JEU.titre||'שיר')+'</div>';
  if(JEU.auteur) h+='<div class="author">'+esc(JEU.auteur)+'</div>';
  h+='</div>';
  h+='<div class="rule"><span>✦</span></div>';

  if(JEU.analyse){
    h+='<div class="intro"><span class="lbl">Vue d\u2019ensemble</span>'+br(JEU.analyse)+'</div>';
  }

  h+='<div class="section-title">Le poème, quatrain par quatrain</div>';
  h+='<div class="section-sub">texte · traduction · analyse</div>';

  JEU.quatrains.forEach(function(q,i){
    h+='<div class="quatrain">';
    h+='<div class="q-num">Quatrain '+(i+1)+'</div>';
    h+='<div class="verse">'+br(q.heb)+'</div>';
    h+='<div class="gap"></div>';
    h+='<div class="trans">'+br(q.fr)+'</div>';
    if(q.an){ h+='<div class="analysis"><span class="lbl">Analyse</span>'+br(q.an)+'</div>'; }
    h+='</div>';
  });

  if(JEU.mots && JEU.mots.length){
    h+='<div class="lex-wrap"><table class="lex"><caption>Lexique</caption>';
    h+='<tr><th>Hébreu</th><th>Translittération</th><th>Français</th></tr>';
    JEU.mots.forEach(function(m){
      h+='<tr><td class="he">'+esc(m.heb||m.h||'')+'</td><td class="tr">'+esc(m.translit||m.t||'')+'</td><td>'+esc(m.fr||m.f||'')+'</td></tr>';
    });
    h+='</table></div>';
  }

  h+='<div class="copyright">© 2026 hebreu-zen — Toutes reproductions interdites et réservées</div>';
  el.innerHTML=h;
}
render();
</script>
</body></html>
