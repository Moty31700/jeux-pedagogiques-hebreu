<style>
/* Style « crème » (20 nov. 2026), commun aux fiches rédigées hébreu-zen */
:root{--bg:#f4f1ea;--carte:#fffdf9;--encre:#1d2430;--doux:#5d6678;--pale:#8a8f9c;--filet:#e7e0d2;
  --indigo:#33489a;--indigo-doux:#e8ebf7;--creme:#f8eed9;--brun:#9c5c12;
  --heb:"Frank Ruhl Libre","Noto Serif Hebrew","Arial Hebrew",serif;--sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--encre);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.sheet{max-width:860px;margin:28px auto 60px;padding:36px 40px 28px;background:var(--carte);border:1px solid var(--filet);
  border-radius:18px;box-shadow:0 1px 2px rgba(40,30,10,.04),0 8px 28px rgba(40,30,10,.06)}
.head{text-align:center;margin-bottom:10px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brun);margin-bottom:8px}
.title-he{font-family:var(--heb);direction:rtl;font-weight:700;font-size:2.2rem;line-height:1.3}
.title-fr{font-weight:600;font-size:1.3rem;color:var(--indigo);margin-top:2px}
.author{font-style:italic;color:var(--doux);margin-top:4px}
.rule{height:1px;background:var(--filet);margin:22px 0;max-width:none}
.rule span{display:none}
.intro{background:var(--creme);border-radius:12px;padding:18px 22px;margin:8px 0 34px;line-height:1.75}
.intro .lbl{font-weight:600;color:var(--brun);display:block;margin-bottom:6px;font-size:.95rem}
.section-title{font-weight:600;font-size:1.3rem;color:var(--indigo);margin:30px 0 2px;padding-bottom:.35em;border-bottom:1px solid var(--filet)}
.section-sub{color:var(--pale);font-style:italic;font-size:.9rem;margin:6px 0 22px}
.quatrain{margin:0 0 34px;padding:0 0 30px;border-bottom:1px solid var(--filet)}
.quatrain:last-of-type{border-bottom:none}
.q-num{display:inline-block;background:var(--indigo-doux);color:var(--indigo);font-weight:600;font-size:.82rem;
  padding:2px 12px;border-radius:999px;margin-bottom:12px}
.verse{font-family:var(--heb);direction:rtl;text-align:right;font-size:1.55rem;line-height:2;font-weight:500;
  background:#fff;border:1px solid var(--filet);border-radius:12px;padding:18px 22px}
.gap{height:1.4em}
.trans{font-style:italic;color:var(--doux);direction:ltr;text-align:left;padding:0 4px}
.analysis{margin-top:16px;line-height:1.75}
.analysis .lbl{font-weight:600;color:var(--indigo);display:block;margin-bottom:2px;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}
.lex-wrap{margin-top:26px}
table.lex{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--filet);border-radius:12px;overflow:hidden}
table.lex caption{font-weight:600;font-size:1.3rem;color:var(--indigo);text-align:left;padding:0 0 10px;caption-side:top}
table.lex th,table.lex td{padding:10px 14px;border-bottom:1px solid var(--filet)}
table.lex th{background:var(--indigo-doux);color:var(--indigo);font-weight:600;font-size:.85rem;text-align:left}
table.lex tr:nth-child(even) td{background:#fbf9f4}
table.lex tr:last-child td{border-bottom:none}
table.lex td.he{font-family:var(--heb);direction:rtl;text-align:right;font-size:1.3rem;font-weight:500;white-space:nowrap}
table.lex td.tr{font-style:italic;color:var(--doux)}
.argot table.lex th{background:var(--creme);color:var(--brun)}
.copyright{margin:40px 0 0;padding-top:14px;border-top:1px solid var(--filet);text-align:center;font-size:12px;color:var(--doux)}
.empty{text-align:center;color:var(--pale);padding:60px 20px;font-style:italic}
.empty .mark{font-size:2rem;color:var(--brun);display:block;margin-bottom:10px}
@media print{body{background:#fff}.sheet{box-shadow:none;border:none;margin:0;max-width:none;padding:0}.quatrain{page-break-inside:avoid}}
@media(max-width:600px){.sheet{margin:0;border-radius:0;border:none;padding:24px 16px}.title-he{font-size:1.8rem}.verse{font-size:1.3rem;padding:14px 16px}}
</style>
</head>

יה ומלאת אהבה."},{"heb":"לוֹכֶדֶת","translit":"lokhedet","fr":"elle capture, elle prend au piège","sens":"participe féminin singulier pa'al, temps présent","racine":"ל-כ-ד","nature":"verbe","genre":"f","nombre":"s","formes":"לָכַד · לֶכֶד","cat":"verbes","emploi":"יָדֵךְ לוֹכֶדֶת את לִבָּנוּ מציגה את האהובה כמי שמחזיקה בלבנו."},{"heb":"יַאֲפִיל","translit":"yaafil","fr":"il s'assombrira, il obscurcira","sens":"verbe hif'il, futur, 3e pers. masculin singulier","racine":"א-פ-ל","nature":"verbe","genre":"m","nombre":"s","formes":"אָפֵל · אֲפֵלָה","cat":"verbes","emploi":"שֶׁיַּאֲפִיל כְּחֶדֶר מתאר את הלב המחשיך כחדר ללא כוכבים."},{"heb":"נְשִׁיקַת טַבָּחַת","translit":"nechiqat tabbakhat","fr":"le baiser d'une cuisinière","sens":"nom féminin singulier construit + nom féminin singulier","racine":"נ-ש-ק / ט-ב-ח","nature":"expression","genre":"f","nombre":"s","formes":"נְשִׁיקָה · טַבָּח","cat":"autre","emploi":"נְשִׁיקַת טַבָּחַת הוא דימוי מכוון לשוני המפחית את גדולת הירח להידמות ביתי וחמים."},{"heb":"שִׁקְמָה","translit":"chiqma","fr":"sycomore (arbre)","sens":"nom féminin singulier","racine":"ש-ק-מ","nature":"nom","genre":"f","nombre":"s","formes":"שִׁקְמוֹת","cat":"noms","emploi":"הַשִּׁקְמָה היא עץ ביבלי ומדיטרני המופיע כדמות מנחמת ומברכת."},{"heb":"אֶקּוֹד","translit":"eqqod","fr":"je m'inclinerai, je me prosternerai","sens":"verbe pa'al, futur, 1e pers. singulier","racine":"ק-ד-ד","nature":"verbe","genre":"—","nombre":"s","formes":"קָדַד · קִידָּה","cat":"verbes","emploi":"אֶקּוֹד לָהּ וְאָרִים מציג תנועה של כניעה והתעוררות כאחת."},{"heb":"חִיּוּכֵנוּ","translit":"khiyoukhénou","fr":"notre sourire","sens":"nom masculin singulier + suffixe possessif 1e pers. pluriel","racine":"ח-י-כ","nature":"nom","genre":"m","nombre":"s","formes":"חִיּוּךְ","cat":"noms","emploi":"חִיּוּכֵנוּ זֶה הוא הסמל השביר של האהבה המשותפת שהמשורר ייפול כדי לאסוף."},{"heb":"מֶרְכָּבוֹת","translit":"merkavot","fr":"carriages, chars, voitures","sens":"nom féminin pluriel","racine":"ר-כ-ב","nature":"nom","genre":"f","nombre":"pl","formes":"מֶרְכָּבָה","cat":"noms","emploi":"הַמֶּרְכָּבוֹת מסמלות את עולם המודרני האלים שבתוכו שורד האהב."}],"phrases":[{"heb":"פְּגִישָׁה","fr":"Rencontre (titre)"},{"heb":"כִּי סָעַרְתְּ עָלַי, לָנֶצַח אֲנַגֶּנְךְ","fr":"Car tu as déferlé sur moi, je te chanterai pour toujours"},{"heb":"כִּי סָעַרְתְּ עָלַי, לָנֶצַח אֲנַגֶּנְךְ","fr":"Car tu as déferlé sur moi, je te chanterai pour toujours"},{"heb":"שָׁוְא חוֹמָה אָצוּר לָךְ, שָׁוְא אַצִּיב דְּלָתַיִם","fr":"En vain je t'élèverais un mur, en vain je dresserais des portes"},{"heb":"שָׁוְא חוֹמָה אָצוּר לָךְ, שָׁוְא אַצִּיב דְּלָתַיִם","fr":"En vain je t'élèverais un mur, en vain je dresserais des portes"},{"heb":"תְּשׁוּקָתִי אֵלַיִךְ וְאֵלַי גַּנֵּךְ","fr":"Mon désir vers toi et vers ton jardin vers moi"},{"heb":"וְאֵלַי גּוּפִי סְחַרְחַר, אוֹבֵד יָדַיִם","fr":"Et mon corps tourne, éperdu, perdant pied"},{"heb":"וְאֵלַי גּוּפִי סְחַרְחַר, אוֹבֵד יָדַיִם","fr":"Et mon corps tourne, éperdu, perdant pied"},{"heb":"פִּתְאוֹמִית לָעַד, עֵינַי בָּךְ הֲלוּמוֹת","fr":"Soudaine pour toujours, mes yeux en toi assommés"},{"heb":"פִּתְאוֹמִית לָעַד, עֵינַי בָּךְ הֲלוּמוֹת","fr":"Soudaine pour toujours, mes yeux en toi assommés"},{"heb":"עֵת בָּרְחוֹב לוֹחֵם, שׁוֹתֵת שְׁקִיעוֹת שֶׁל פֶּטֶל","fr":"Quand dans la rue elle combat, dégoulinant de couchers de soleil de framboise"},{"heb":"תְּאַלְּמִי אוֹתִי לַאֲלֻמּוֹת","fr":"Tu me réduis au silence en gerbes"},{"heb":"תְּאַלְּמִי אוֹתִי לַאֲלֻמּוֹת","fr":"Tu me réduis au silence en gerbes"},{"heb":"אַל תִּתְחַנְּנִי אֶל הַנְּסוּגִים מִגֶּשֶׁת","fr":"Ne supplie pas ceux qui reculent à l'approche"},{"heb":"לְבַדִּי אֶהְיֶה בְּאַרְצוֹתַיִךְ הָלָךְ","fr":"Seul je serai dans tes terres, un passant"},{"heb":"תְּפִלָּתִי אַחַת וְהִיא אוֹמֶרֶת: הֵא לָךְ","fr":"Ma prière est une et elle dit : tiens, prends"},{"heb":"עַד קַצְווֵי הָעֶצֶב, עַד עֵינוֹת הַלַּיִל","fr":"Jusqu'aux confins de la tristesse, jusqu'aux sources de la nuit"},{"heb":"אֱלֹהַי צִוַּנִי שֶׁאֶשָּׂא לְעוֹלְלַיִךְ","fr":"Mon Dieu m'a ordonné de porter à tes enfants"},{"heb":"מֵעֳנִיִּי הָרַב שְׁקֵדִים וְצִמּוּקִים","fr":"De ma grande pauvreté des amandes et des raisins secs"},{"heb":"טוֹב שֶׁאֶת לִבָּנוּ עוֹד יָדֵךְ לוֹכֶדֶת","fr":"Il est bon que ta main capture encore notre coeur"},{"heb":"אַל תַּנִּיחִי לוֹ שֶׁיַּאֲפִיל כְּחֶדֶר","fr":"Ne lui permets pas de s'assombrir comme une chambre"},{"heb":"שָׁם לוֹהֵט יָרֵחַ כְּנְשִׁיקַת טַבָּחַת","fr":"Là brûle la lune comme le baiser d'une cuisinière"},{"heb":"שָׁם שִׁקְמָה תַּפִּיל עָנָף לִי כְּמִטְפַּחַת","fr":"Là un sycomore me jettera un rameau comme un mouchoir"},{"heb":"וַאֲנִי אֶקּוֹד לָהּ וְאָרִים","fr":"Et moi je m'inclinerai devant lui et je me relèverai"},{"heb":"אֶת חִיּוּכֵנוּ זֶה מִבֵּין הַמֶּרְכָּבוֹת","fr":"Ce sourire entre les carriages"},{"heb":"אֶת חִיּוּכֵנוּ זֶה מִבֵּין הַמֶּרְכָּבוֹת","fr":"Ce sourire entre les carriages"}],"quatrains":[{"heb":"כִּי סָעַרְתְּ עָלַי, לָנֶצַח אֲנַגֶּנְךְ\nשָׁוְא חוֹמָה אָצוּר לָךְ, שָׁוְא אַצִּיב דְּלָתַיִם!\nתְּשׁוּקָתִי אֵלַיִךְ וְאֵלַי גַּנֵּךְ\nוְאֵלַי גּוּפִי סְחַרְחַר, אוֹבֵד יָדַיִם!","fr":"Car tu as déferlé sur moi, je te chanterai pour toujours / En vain je t'élèverais un mur, en vain je dresserais des portes ! / Mon désir vers toi et vers ton jardin vers moi / Et mon corps tourne, éperdu, perdant pied !","an":"Le premier quatrain pose d'emblée la dynamique centrale du poème : l'irruption violente de l'aimée ('סָעַרְתְּ עָלַי', tempête sur moi) déclenche une réponse lyrique éternelle ('לָנֶצַח אֲנַגֶּנְךְ'). La double répétition de 'שָׁוְא' (en vain) souligne l'inutilité de toute défense intérieure face à cet assaut amoureux. La métaphore du mur et des portes évoque l'enceinte du cœur ou de l'âme, impuissante à se fermer. Le mot 'גַּנֵּךְ' (ton jardin) convoque l'univers du Cantique des Cantiques, ancrant le désir dans une tradition érotique biblique. Le corps lui-même ('גּוּפִי') devient sujet de la phrase finale, 'סְחַרְחַר' (étourdi, tournoyant) et 'אוֹבֵד יָדַיִם' (perdant les mains, désemparé) : la syntaxe éclatée mime la dissolution du sujet sous l'effet du désir."},{"heb":"לִסְפָרִים רַק אַתְּ הַחֵטְא וְהַשּׁוֹפֶטֶת.\nפִּתְאוֹמִית לָעַד, עֵינַי בָּךְ הֲלוּמוֹת,\nעֵת בָּרְחוֹב לוֹחֵם, שׁוֹתֵת שְׁקִיעוֹת שֶׁל פֶּטֶל,\nתְּאַלְּמִי אוֹתִי לַאֲלֻמּוֹת.","fr":"Pour les livres tu n'es que le péché et le juge. / Soudaine pour toujours, mes yeux en toi assommés, / Quand dans la rue elle combat, dégoulinant de couchers de soleil de framboise, / Tu me réduis au silence en gerbes.","an":"Ce quatrain ouvre sur une tension entre littérature et expérience vécue : pour les livres, la femme aimée est à la fois 'הַחֵטְא' (le péché) et 'הַשּׁוֹפֶטֶת' (la juge), deux rôles contradictoires qui résument l'ambivalence de l'amour dans la tradition. Mais la réalité poétique dépasse la classification : 'פִּתְאוֹמִית לָעַד' (soudaine pour toujours) est un oxymore saisissant, l'instant de la rencontre devenant éternel. L'image de la rue qui 'combat' et 'dégouline de couchers de soleil de framboise' est une synesthésie baroque et sensuelle, mêlant couleur, texture et lumière dans un tableau expressionniste. Le verbe 'תְּאַלְּמִי' (tu me rends muet) et 'אֲלֻמּוֹת' (gerbes, fagots) créent une paronomase remarquable : le poète est réduit au silence comme une gerbe de blé, à la fois fauché et lié."},{"heb":"אַל תִּתְחַנְּנִי אֶל הַנְּסוּגִים מִגֶּשֶׁת.\nלְבַדִּי אֶהְיֶה בְּאַרְצוֹתַיִךְ הָלָךְ.\nתְּפִלָּתִי דָּבָר אֵינֶנָּה מְבַקֶּשֶׁת,\nתְּפִלָּתִי אַחַת וְהִיא אוֹמֶרֶת: הֵא לָךְ!","fr":"Ne supplie pas ceux qui reculent à l'approche. / Seul je serai dans tes terres, un passant. / Ma prière ne demande rien, / Ma prière est une et elle dit : tiens, prends !","an":"Ce quatrain est le pivot mystique et éthique du poème. Le poète refuse l'intercession des 'נְּסוּגִים' (ceux qui reculent), ceux qui n'osent pas s'approcher, se positionnant comme un solitaire résolu ('לְבַדִּי'). L'image du 'הָלָךְ' (marcheur, pèlerin, passant) dans les 'אַרְצוֹתַיִךְ' (tes terres, pays) élève l'aimée au statut d'un territoire à parcourir seul. La double occurrence de 'תְּפִלָּתִי' (ma prière) instaure un rythme incantatoire et liturgique, mais cette prière est paradoxale : elle ne demande rien ('דָּבָר אֵינֶנָּה מְבַקֶּשֶׁת'). L'exclamation finale 'הֵא לָךְ' (tiens, voilà pour toi) renverse la logique de la prière : ce n'est plus une supplique mais une offrande, un don absolu de soi, dans un geste de générosité totale et désintéressée."},{"heb":"עַד קַצְווֵי הָעֶצֶב, עַד עֵינוֹת הַלַּיִל\nבִּרְחוֹבוֹת בַּרְזֶל רֵיקִים וַאֲרֻכִּים,\nאֱלֹהַי צִוַּנִי שֶׁאֶשָּׂא לְעוֹלְלַיִךְ,\nמֵעֳנִיִּי הָרַב שְׁקֵדִים וְצִמּוּקִים.","fr":"Jusqu'aux confins de la tristesse, jusqu'aux sources de la nuit / Dans des rues de fer vides et longues, / Mon Dieu m'a ordonné de porter à tes enfants, / De ma grande pauvreté des amandes et des raisins secs.","an":"Cette strophe est l'une des plus denses du poème, unissant misère urbaine et générosité mystique. Les 'רְחוֹבוֹת בַּרְזֶל' (rues de fer) dessinent un paysage moderne, industriel et déshumanisé, traversé jusqu'aux 'קַצְווֵי הָעֶצֶב' (confins de la tristesse) et aux 'עֵינוֹת הַלַּיִל' (sources de la nuit). Le commandement divin ('אֱלֹהַי צִוַּנִי') confère à l'acte d'amour une dimension prophétique et obligatoire. Mais la nature de l'offrande est humble et touchante : 'שְׁקֵדִים וְצִמּוּקִים' (amandes et raisins secs), nourriture simple, presque enfantine, tirée d'une pauvreté avouée ('מֵעֳנִיִּי הָרַב'). Le contraste entre la grandeur du commandement divin et la modestie du don crée une émotion intense, caractéristique du lyrisme de Nathan, entre élévation et humilité."},{"heb":"טוֹב שֶׁאֶת לִבָּנוּ עוֹד יָדֵךְ לוֹכֶדֶת,\nאַל תְּרַחֲמִיהוּ בְּעוֹיְפוֹ לָרוּץ,\nאַל תַּנִּיחִי לוֹ שֶׁיַּאֲפִיל כְּחֶדֶר\nבְּלִי הַכּוֹכָבִים שֶׁנִּשְׁאֲרוּ בַּחוּץ.","fr":"Il est bon que ta main capture encore notre cœur, / Ne le prends pas en pitié quand il se fatigue de courir, / Ne lui permets pas de s'assombrir comme une chambre / Sans les étoiles qui sont restées dehors.","an":"Ce quatrain constitue une supplique adressée à l'aimée pour qu'elle maintienne son emprise sur le cœur collectif ('לִבָּנוּ', notre cœur). Le passage du 'je' au 'nous' est significatif : le poète parle au nom de tous ceux qui aiment. La main qui 'loche' (capture, 'לוֹכֶדֶת') le cœur est une image ambivalente, entre emprisonnement et protection. La demande paradoxale 'אַל תְּרַחֲמִיהוּ' (ne le prends pas en pitié) exprime le souhait que l'intensité ne soit jamais adoucie par la compassion. La métaphore finale est d'une beauté frappante : le cœur qui s'assombrit 'כְּחֶדֶר בְּלִי הַכּוֹכָבִים' (comme une chambre sans étoiles) dit que sans l'aimée, la conscience intérieure perd sa lumière cosmique, ses fenêtres sur l'infini."},{"heb":"שָׁם לוֹהֵט יָרֵחַ כְּנְשִׁיקַת טַבָּחַת,\nשָׁם רָקִיעַ לַח אֶת שִׁיעוּלוֹ מַרְעִים,\nשָׁם שִׁקְמָה תַּפִּיל עָנָף לִי כְּמִטְפַּחַת\nוַאֲנִי אֶקּוֹד לָהּ וְאָרִים.","fr":"Là brûle la lune comme le baiser d'une cuisinière, / Là le ciel humide fait gronder sa toux, / Là un sycomore me jettera un rameau comme un mouchoir / Et moi je m'inclinerai devant lui et je me relèverai.","an":"Cette strophe peint un paysage nocturne et organique d'une originalité saisissante. La comparaison de la lune avec 'נְשִׁיקַת טַבָּחַת' (le baiser d'une cuisinière) est délibérément prosaïque et charnelle, désacralisant l'astre tout en lui conservant une chaleur sensuelle. Le ciel qui 'fait gronder sa toux' ('שִׁיעוּלוֹ מַרְעִים') est une personnification pathétique, le cosmos lui-même souffrant. Le sycomore ('שִׁקְמָה'), arbre biblique et méditerranéen, offre son rameau comme un mouchoir : geste de consolation ou de salutation. La réponse du poète, 'אֶקּוֹד לָהּ וְאָרִים' (je m'inclinerai et je me relèverai), est un geste de dignité et de résilience, une révérence à la nature et à la vie qui continue malgré la douleur."},{"heb":"וַאֲנִי יוֹדֵעַ כִּי לְקוֹל הַתֹּף,\nבְּעָרֵי מִסְחָר חֵרְשׁוֹת וְכוֹאֲבוֹת,\nיוֹם אֶחָד אֶפּוֹל עוֹד פָּצוּעַ רֹאשׁ לִקְטֹף\nאֶת חִיּוּכֵנוּ זֶה מִבֵּין הַמֶּרְכָּבוֹת.","fr":"Et moi je sais qu'au son du tambour, / Dans des villes de commerce sourdes et douloureuses, / Un jour je tomberai encore, blessé à la tête, pour cueillir / Ce sourire entre les carriages.","an":"Le quatrain final est une prophétie lucide et tragique. Le tambour ('הַתֹּף') instaure un rythme martial ou carnavalesque, dans des villes 'חֵרְשׁוֹת וְכוֹאֲבוֹת' (sourdes et douloureuses), espace urbain aliéné. La chute annoncée ('אֶפּוֹל') et la blessure à la tête ('פָּצוּעַ רֹאשׁ') disent l'inévitabilité du sacrifice amoureux. Mais l'acte pour lequel le poète tombe est de 'לִקְטֹף אֶת חִיּוּכֵנוּ זֶה' (cueillir ce sourire entre les carriages) : image prodigieuse où le sourire partagé devient une fleur à ramasser dans la violence urbaine. 'מִבֵּין הַמֶּרְכָּבוֹת' (entre les carriages, les chars) peut évoquer la foule, la modernité mécanique ou même une allusion biblique aux chars de guerre. Le poème se ferme sur un acte de beauté fragile arraché à la blessure."}],"analyse":"Nathan (נָתָן) est un poète hébreu moderne dont ce poème 'פְּגִישָׁה' (Rencontre) exprime avec une intensité lyrique et mystique la rencontre foudroyante avec une femme aimée, élevée au rang d'expérience quasi-divine. La forme est celle d'un poème en strophes de quatre vers (quatrains), avec des rimes partielles et un mètre irrégulier caractéristique de la poésie hébraïque moderne, oscillant entre l'intime et le cosmique. Le registre mêle le registre élégiaque, le registre religieux (prière, commandement divin) et le registre sensoriel intense, créant une tension entre impuissance et adoration. Le thème central est l'amour comme force irrésistible, destructrice et salvatrice à la fois, inscrite dans l'espace urbain et naturel."};

function render(){
  const el=document.getElementById('sheet');
  if(!JEU.quatrains || !JEU.quatrains.length){
    el.innerHTML='<div class="empty"><span class="mark">✦</span>En attente du poème.<br>La fiche se remplit dès que la leçon est générée.</div>';
    return;
  }
  let h='';
  h+='<div class="head">';
  h+='<div class="kicker">Fiche de lecture — poésie hébraïque</div>';
  h+='<div class="title-he">'+esc(JEU.titre||'שיר')+'</div>';
  if(JEU.auteur) h+='<div class="author">'+esc(JEU.auteur)+'</div>';
  h+='</div>';
  h+='<div class="rule"><span>✦</span></div>';

  if(JEU.analyse){
    h+='<div class="intro"><span class="lbl">Vue d\u2019ensemble</span>'+br(JEU.analyse)+'</div>';
  }

  h+='<div class="section-title">Le poème, quatrain par quatrain</div>';
  h+='<div class="section-sub">texte · traduction · analyse</div>';

  JEU.quatrains.forEach(function(q,i){
    h+='<div class="quatrain">';
    h+='<div class="q-num">Quatrain '+(i+1)+'</div>';
    h+='<div class="verse">'+br(q.heb)+'</div>';
    h+='<div class="gap"></div>';
    h+='<div class="trans">'+br(q.fr)+'</div>';
    if(q.an){ h+='<div class="analysis"><span class="lbl">Analyse</span>'+br(q.an)+'</div>'; }
    h+='</div>';
  });

  if(JEU.mots && JEU.mots.length){
    h+='<div class="lex-wrap"><table class="lex"><caption>Lexique</caption>';
    h+='<tr><th>Hébreu</th><th>Translittération</th><th>Français</th></tr>';
    JEU.mots.forEach(function(m){
      h+='<tr><td class="he">'+esc(m.heb||m.h||'')+'</td><td class="tr">'+esc(m.translit||m.t||'')+'</td><td>'+esc(m.fr||m.f||'')+'</td></tr>';
    });
    h+='</table></div>';
  }

  h+='<div class="copyright">© 2026 hebreu-zen — Toutes reproductions interdites et réservées</div>';
  el.innerHTML=h;
}
render();
</script>
</body></html>
