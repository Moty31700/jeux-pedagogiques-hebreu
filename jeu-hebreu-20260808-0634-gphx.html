<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thème</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fdf8f0;--parch:#ede8d8;--ink:#1a1408;--ink2:#4a3f28;--ink3:#7a6a50;
  --gold:#c9952a;--gold2:#e8b84b;--blue:#1e5fa8;--blue2:#4a90d9;
  --green:#2e7d32;--red:#c62828;--orange:#e65100;--purple:#6a1b9a;
  --shadow:rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--ink);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 12% 8%,rgba(201,149,42,.09) 0%,transparent 52%),
             radial-gradient(ellipse at 88% 92%,rgba(30,95,168,.07) 0%,transparent 52%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(180,160,100,.06) 28px,rgba(180,160,100,.06) 29px);
  pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:26px 16px 90px}

.app-header{text-align:center;margin-bottom:18px}
.app-heb{font-family:'Noto Serif Hebrew',serif;font-size:40px;font-weight:900;color:var(--ink);line-height:1.2;text-shadow:2px 2px 0 rgba(201,149,42,.13)}
.app-fr{font-size:16px;font-style:italic;color:var(--ink2);margin-top:2px}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);opacity:.45;margin:10px auto;width:220px}
.ornament::before,.ornament::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.reglages{background:rgba(255,251,240,.95);border:1px solid rgba(201,149,42,.2);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow)}
.reglages .titre-mini{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid rgba(201,149,42,.3);background:rgba(201,149,42,.06);color:var(--ink2);border-radius:20px;padding:5px 13px;font-family:'Crimson Pro',serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chip.tous{border-style:dashed}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink2)}
.switch .box{width:44px;height:24px;border-radius:14px;background:rgba(0,0,0,.15);position:relative;transition:.2s}
.switch .box::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on .box{background:var(--green)}
.switch.on .box::after{left:22px}

.tabs{display:flex;flex-wrap:wrap;gap:5px;background:rgba(237,232,216,.6);border-radius:16px;padding:5px;margin-bottom:20px;border:1px solid rgba(201,149,42,.15)}
.tab{flex:1 0 auto;padding:9px 10px;border:none;border-radius:11px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:12.5px;font-weight:700;color:var(--ink3);background:transparent;transition:.2s}
.tab.active{background:rgba(255,251,240,.98);color:var(--ink);box-shadow:0 2px 12px var(--shadow);border:1px solid rgba(201,149,42,.22)}
.tab:hover:not(.active){background:rgba(255,251,240,.6)}

.card{background:rgba(255,251,240,.97);border-radius:18px;padding:20px 20px;box-shadow:0 2px 0 rgba(201,149,42,.18),0 8px 28px var(--shadow);border:1px solid rgba(201,149,42,.18);margin-bottom:14px}
.heb{font-family:'Noto Serif Hebrew',serif;direction:rtl;color:var(--ink)}
.heb-xl{font-size:40px;font-weight:900;text-align:center;line-height:1.3}
.heb-lg{font-size:26px;font-weight:700;line-height:1.6}
.heb-md{font-size:20px;line-height:1.9}
.fr{font-style:italic}
.sens{color:var(--ink3);font-size:15px;margin-top:6px}
.audio-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(201,149,42,.1);border:1.5px solid rgba(201,149,42,.3);color:var(--gold);border-radius:20px;padding:4px 12px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:13px;font-weight:600;transition:.2s}
.audio-btn:hover{background:rgba(201,149,42,.2)}
.fr-hidden{filter:blur(7px);opacity:.4;cursor:pointer;user-select:none}
.reveal{background:rgba(201,149,42,.08);border:1.5px solid rgba(201,149,42,.25);color:var(--gold);border-radius:9px;padding:6px 10px;cursor:pointer;font-size:14px}
.center{text-align:center}
.badge{display:inline-block;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.b-noms{background:var(--blue)}.b-verbes{background:var(--green)}.b-adjectifs{background:var(--purple)}.b-autre{background:var(--orange)}

table.lex{width:100%;border-collapse:collapse}
table.lex th,table.lex td{padding:9px 8px;border-bottom:1px solid rgba(201,149,42,.15);text-align:left}
table.lex th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}
table.lex td.he{font-family:'Noto Serif Hebrew',serif;direction:rtl;font-size:20px;text-align:right;font-weight:700}
.morpho-row{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px;margin-top:8px}
.morpho-row .k{color:var(--ink3);font-weight:600}
.morpho-he{font-family:'Noto Serif Hebrew',serif;direction:rtl}

.btn{border:none;border-radius:12px;padding:12px 18px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:15px;font-weight:700;transition:.2s}
.btn-v{background:var(--green);color:#fff}.btn-f{background:var(--red);color:#fff}
.btn-g{background:var(--gold);color:#fff}
.btn-o{background:transparent;border:1.5px solid rgba(201,149,42,.35);color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.q-card.correct{background:#edf7ee;border-color:#4caf50}
.q-card.wrong{background:#fdeaea;border-color:#ef5350}

.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center;margin:14px 0;min-height:44px}
.tile{font-family:'Noto Serif Hebrew',serif;font-size:20px;background:rgba(201,149,42,.12);border:1.5px solid rgba(201,149,42,.35);border-radius:10px;padding:6px 12px;cursor:pointer}
.tile.used{opacity:.3;pointer-events:none}
.zone{min-height:48px;border:2px dashed rgba(201,149,42,.3);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center}

.bilan-pct{font-size:56px;font-weight:900;text-align:center;color:var(--gold)}
.bilan-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(201,149,42,.15);font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div class="app-heb">Thème</div>
    <div class="app-fr">Jeu</div>
    <div class="ornament">✦</div>
  </div>

  <div class="reglages">
    <div class="titre-mini">Réglages</div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div class="switch" id="sw-nikoud" onclick="toggleNikoud()"><span class="box"></span><span>Avec nikoud</span></div>
    </div>
    <div class="titre-mini" style="margin-top:12px">Catégories</div>
    <div class="chips" id="cat-chips"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<script>
/* ============================================================
   STRUCTURE "JEU" = LE CONTRAT que l'IA devra remplir à chaque leçon.
   ============================================================ */
const JEU = {"titre":"Thème","mots":[{"heb":"מַצּוּק / מַצּוּקִים","translit":"matsuk / matsukim","fr":"falaise, à-pic, escarpement","sens":"Nom masculin dérivé de la racine צ-ו-ק (presser, serrer), désignant une paroi rocheuse abrupte ; pluriel régulier en ים-.","racine":"צ-ו-ק","nature":"nom","genre":"—","nombre":"—","formes":"מַצּוּק · מַצּוּקִים · מַצּוּק הָהָר","cat":"noms","emploi":"B2"},{"heb":"לְהִתְנַשֵּׂף / הִתְנַשְּׁפוּת","translit":"lehitnashef / hitnashfut","fr":"haleter, souffler (d'effort) / essoufflement","sens":"Verbe à la forme הִתְפַּעֵל de la racine נ-ש-פ (souffler), exprimant une action réflexive d'halètement due à l'effort physique.","racine":"נ-ש-פ","nature":"verbe","genre":"—","nombre":"—","formes":"מִתְנַשֵּׁף · מִתְנַשֶּׁפֶת · הִתְנַשֵּׁף · יִתְנַשֵּׁף","cat":"verbes","emploi":"B2"},{"heb":"מִשְׁעוֹל / מִשְׁעוֹלִים","translit":"mish'ol / mish'olim","fr":"sentier, chemin étroit","sens":"Nom masculin de la forme מִפְעוֹל, dérivé de la racine ש-ע-ל (marcher en file), désignant un étroit chemin de randonnée.","racine":"ש-ע-ל","nature":"nom","genre":"—","nombre":"—","formes":"מִשְׁעוֹל · מִשְׁעוֹלִים · מִשְׁעוֹל הָהָר","cat":"noms","emploi":"B2"},{"heb":"תְּלוּלִית / תְּלוּלִיּוֹת","translit":"telulít / teluliyot","fr":"pente raide, déclivité abrupte","sens":"Nom féminin dérivé de l'adjectif תָּלוּל (abrupt, escarpé), lui-même issu de la racine ת-ל-ל ; le suffixe ית- marque le féminin diminutif.","racine":"ת-ל-ל","nature":"nom","genre":"—","nombre":"—","formes":"תְּלוּלִית · תְּלוּלִיּוֹת · תְּלוּלִית הָהָר","cat":"noms","emploi":"B2"},{"heb":"פִּסְגָּה / פִּסְגּוֹת","translit":"pisgá / pisgot","fr":"sommet, cime, pic","sens":"Nom féminin de la forme פִּעְלָה, issu de la racine פ-ס-ג (atteindre le sommet, culminer) ; pluriel en וֹת-.","racine":"פ-ס-ג","nature":"nom","genre":"—","nombre":"—","formes":"פִּסְגָּה · פִּסְגּוֹת · פִּסְגַּת הָהָר","cat":"noms","emploi":"B2"},{"heb":"מַדְרוֹן / מַדְרוֹנִים","translit":"madron / madronim","fr":"pente, versant","sens":"Nom masculin de la racine ד-ר-נ, formé sur le schème מַפְעוֹל, désignant une surface inclinée.","racine":"ד-ר-נ","nature":"nom","genre":"—","nombre":"—","formes":"מַדְרוֹן · מַדְרוֹנִים · מַדְרוֹן תָּלוּל","cat":"noms","emploi":"B2"},{"heb":"עֲנָנָה / עֲנָנוֹת","translit":"anana / ananot","fr":"nuage (isolé), nuée","sens":"Nom féminin dérivé de la racine ע-נ-נ, formé sur le schème עֲפָעָה, désignant un nuage particulier ou une nuée dense.","racine":"ע-נ-נ","nature":"nom","genre":"—","nombre":"—","formes":"עֲנָנָה · עֲנָנוֹת · עֲנָנָה כְּבֵדָה","cat":"noms","emploi":"B2"},{"heb":"לִצְעֹד / צְעִידָה","translit":"lits'od / ts'ida","fr":"marcher, avancer à pas mesurés / marche, progression","sens":"Verbe de la racine צ-ע-ד à la בִּנְיָן קַל, exprimant une marche rythmée et déterminée, distinct de הָלַךְ par sa connotation de progression volontaire.","racine":"צ-ע-ד","nature":"verbe","genre":"—","nombre":"—","formes":"צָעַד · צוֹעֵד · יִצְעַד · צְעִידָה","cat":"verbes","emploi":"B2"},{"heb":"גְּבָהִים / גּוֹבַהּ","translit":"gvahim / govah","fr":"hauteurs / altitude, hauteur","sens":"Nom masculin de la racine ג-ב-ה, גּוֹבַהּ désigne l'altitude ou la hauteur mesurée, tandis que גְּבָהִים au pluriel évoque les lieux élevés ou les hauteurs en tant qu'espaces.","racine":"ג-ב-ה","nature":"nom","genre":"—","nombre":"—","formes":"גּוֹבַהּ · גְּבָהִים · בְּגּוֹבַהּ","cat":"noms","emploi":"B2"},{"heb":"שְׁבִיל / שְׁבִילִים","translit":"shvil / shvilim","fr":"sentier, chemin étroit","sens":"Nom masculin de la racine ש-ב-ל sur le schème פְּעִיל, désignant un chemin tracé par le passage répété, souvent en milieu naturel ; au pluriel, peut désigner des voies ou des pistes de randonnée.","racine":"ש-ב-ל","nature":"nom","genre":"—","nombre":"—","formes":"שְׁבִיל · שְׁבִילִים · שְׁבִיל יִשְׂרָאֵל","cat":"noms","emploi":"B2"}],"phrases":[{"heb":"הַמְּטַיְּלִים עָמְדוּ בְּקַצֵּה הַמַּצּוּק וְהִתְפַּעֲלוּ מִן הַנּוֹף הַנִּשְׂגָּב.","fr":"Les randonneurs se tenaient au bord de la falaise et s'émerveillaient du paysage sublime."},{"heb":"אַחֲרֵי שָׁעָה שְׁלֵמָה שֶׁל עֲלִיָּה תְּלוּלָה, הִתְחִיל דָּוִד לְהִתְנַשֵּׁף בִּכְבֵדוּת.","fr":"Après une heure entière de montée escarpée, David commença à haleter lourdement."},{"heb":"הַמִּשְׁעוֹל הַצַּר פָּנָה שְׂמֹאלָה וְהוֹבִיל אֶל מַעְיָן נָסְתָּר בֵּין הַסְּלָעִים.","fr":"Le sentier étroit tournait à gauche et menait à une source cachée entre les rochers."},{"heb":"הַתְּלוּלִית הַחֲדָה הַזֹּאת הָיְתָה הַמִּבְחָן הַקָּשֶׁה בְּיוֹתֵר בַּמַּסְלוּל כֻּלּוֹ.","fr":"Cette pente abrupte était l'épreuve la plus difficile de tout le parcours."},{"heb":"לְאַחַר טִיפּוּס מְיַגֵּעַ שֶׁל שֵׁשׁ שָׁעוֹת, הִגִּיעוּ הַמְּטַיְּלִים סוֹף סוֹף אֶל הַפִּסְגָּה.","fr":"Après une ascension épuisante de six heures, les randonneurs atteignirent enfin le sommet."},{"heb":"הַמַּדְרוֹן הָיָה תָּלוּל מְאֹד וְהַלֵּב דָּפַק בְּחָזְקָה בְּעֵת הָעֲלִיָּה.","fr":"La pente était très raide et le cœur battait fort lors de la montée."},{"heb":"עֲנָנָה כֵּהָה כִּסְּתָה אֶת הַפִּסְגָּה וְהִסְתִּירָה אֶת הַנּוֹף כֻּלּוֹ.","fr":"Un nuage sombre recouvrit le sommet et cacha tout le paysage."},{"heb":"צָעַדְנוּ בְּשֶׁקֶט לְאוֹרֶךְ הַשְּׁבִיל הַצָּר בֵּין הַסְּלָעִים.","fr":"Nous avancions en silence le long du sentier étroit entre les rochers."},{"heb":"בְּגּוֹבַהּ שֶׁל אַלְפַּיִם מֶטֶר הָאֲוִיר דַּק וְהַנְּשִׁימָה נַעֲשֵׂית קָשָׁה יוֹתֵר.","fr":"À une altitude de deux mille mètres, l'air est rare et la respiration devient plus difficile."},{"heb":"הַשְּׁבִיל הִתְפַּתֵּל בֵּין הָעֲצֵי הָאֹרֶן וְנֶעֱלַם בַּעֲרָפֶל הַבֹּקֶר.","fr":"Le sentier serpentait entre les pins et disparaissait dans la brume matinale."}],"textes":[{"titre":"Quotidien","heb":"יָצָאנוּ לְטִיּוּל הַר בְּשַׁבָּת בַּבֹּקֶר. הַשְּׁבִיל הָיָה מְסֻמָּן הֵיטֵב וְלֹא הִתְקַשֵּׁינוּ לִמְצֹא אֶת הַדֶּרֶךְ. צָעַדְנוּ כְּשָׁעָה וְחֵצִי עַד שֶׁהִגַּעְנוּ לְנְקֻדַּת תַּצְפִּית עִם נוֹף מְרַהִיב. הָאֲוִיר בַּגּוֹבַהּ הָיָה צוֹנֵן וּרְעַנָּן.","fr":"Nous sommes partis en randonnée en montagne le samedi matin. Le sentier était bien balisé et nous n'avons pas eu de mal à trouver le chemin. Nous avons marché environ une heure et demie avant d'atteindre un point de vue avec un panorama magnifique. L'air en altitude était frais et vivifiant."},{"titre":"Familier","heb":"יַאלָּה, קַמְנוּ בְּשֶׁשׁ בַּבֹּקֶר וְיָצָאנוּ לְהַר לִפְנֵי שֶׁהַשֶּׁמֶשׁ תַּשְׁרֹף אֶת הַמֹּחַ. הַמַּדְרוֹן הָרִאשׁוֹן הָיָה מַמָּשׁ מְפַרְקֵן, כָּבֵד בְּחַיִּים. אֲבָל כְּשֶׁהִגַּעְנוּ לְמַעְלָה וְרָאִינוּ אֶת כָּל הָעֲנָנוֹת מִתַּחְתֵּינוּ, אָמַרְנוּ וָאוּ, שָׁוֶוה כָּל שֶׁקֶל. צָעַדְנוּ בְּחֶזְרָה בְּרִיצָה כִּי הַבֶּטֶן כְּבָר צָרַחְה מֵרָעָב.","fr":"Allez, on s'est levés à six heures du mat et on est partis à la montagne avant que le soleil ne nous grille le cerveau. La première pente, c'était vraiment l'enfer, super costaud. Mais quand on est arrivés en haut et qu'on a vu tous les nuages en dessous de nous, on a dit ouah, ça valait chaque shekel. On a redescendu le sentier en courant parce que le ventre criait déjà famine."},{"titre":"Litteraire","heb":"בֵּין עֲנָנָה לַעֲנָנָה פִּלֵּחַ אוֹר הַשַּׁחַר אֶת הַגְּבָהִים בְּחַרְבּוֹת כֶּסֶף שָׁקֵט. צָעַדְתִּי לְבַדִּי עַל הַשְּׁבִיל הָאַבְנִי, כְּשֶׁהַמַּדְרוֹן מִתַּחְתַּי נֶאֱנַח בְּקוֹל הָרוּחַ. הָיִיתִי קָטָן בְּתוֹךְ גָּדְלוֹ הַשּׁוֹתֵק שֶׁל הָהָר, וּבְכָל זֹאת חָשַׁתִּי שֶׁמַּשֶּׁהוּ עָתִיק בַּנּוֹף מַכִּיר אוֹתִי.","fr":"Entre un nuage et l'autre, la lumière de l'aube transperçait les hauteurs de silencieuses épées d'argent. Je marchais seul sur le sentier pierreux, tandis que la pente en dessous de moi soupirait au son du vent. J'étais petit au sein de la grandeur silencieuse de la montagne, et pourtant je sentais que quelque chose d'ancien dans ce paysage me reconnaissait."}]};
/* ↑↑↑  VIDE — l'IA remplit mots[] / phrases[] / textes[] à chaque leçon (voir contrat).  ↑↑↑ */

let sansNikoud = false;
let selCats = new Set(JEU.mots.map(m=>m.cat));
let score = {ok:0, ko:0};

const NIKOUD = /[\u0591-\u05C7]/g;
function strip(s){ return String(s).replace(NIKOUD,''); }
function H(s){ return sansNikoud ? strip(s) : s; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function motsF(){ return JEU.mots.filter(m=>selCats.has(m.cat)); }
function badgeClass(c){ return ['noms','verbes','adjectifs'].includes(c) ? 'b-'+c : 'b-autre'; }

function say(txt){
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(strip(txt)); u.lang='he-IL'; u.rate=.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function audioBtn(txt){ return '<button class="audio-btn" onclick="say(\''+String(txt).replace(/'/g,"\\'")+'\')">🔊 Écouter</button>'; }

const TABS = [
  {id:'mots',lbl:'Mots'},{id:'morpho',lbl:'Morphologie'},{id:'lexique',lbl:'Lexique'},
  {id:'phrases',lbl:'Phrases'},{id:'textes',lbl:'3 Textes'},{id:'vf',lbl:'Vrai/Faux'},
  {id:'recon',lbl:'Reconstituer'},{id:'bilan',lbl:'Score'}
];
let ongletCourant = 'mots';
function initTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    '<button class="tab'+(t.id===ongletCourant?' active':'')+'" onclick="showTab(\''+t.id+'\')">'+t.lbl+'</button>').join('');
}
function showTab(id){ ongletCourant=id; initTabs(); render(); }

function initReglages(){
  const cats = [...new Set(JEU.mots.map(m=>m.cat))];
  let html = '<button class="chip tous'+(selCats.size===cats.length?' on':'')+'" onclick="toutesCats()">Toutes</button>';
  html += cats.map(c=>'<button class="chip '+(selCats.has(c)?'on':'')+'" onclick="toggleCat(\''+c+'\')">'+c+'</button>').join('');
  document.getElementById('cat-chips').innerHTML = html;
  const sw=document.getElementById('sw-nikoud');
  sw.className = 'switch'+(sansNikoud?'':' on');
  sw.querySelector('span:last-child').textContent = sansNikoud ? 'Sans nikoud' : 'Avec nikoud';
}
function toggleNikoud(){ sansNikoud=!sansNikoud; initReglages(); render(); }
function toggleCat(c){ if(selCats.has(c)){ if(selCats.size>1) selCats.delete(c);} else selCats.add(c); vfList=[]; initReglages(); render(); }
function toutesCats(){ selCats = new Set(JEU.mots.map(m=>m.cat)); vfList=[]; initReglages(); render(); }

function render(){
  if(!JEU.mots || JEU.mots.length===0){
    document.getElementById('content').innerHTML = '<div class="card center" style="padding:44px 20px;color:var(--ink3)"><div style="font-size:40px;margin-bottom:12px;color:var(--gold)">✦</div>En attente des mots de la leçon.<br>Le jeu se remplit automatiquement dès que l\'élève fait sa demande.</div>';
    return;
  }
  const map = {mots:rMots,morpho:rMorpho,lexique:rLexique,phrases:rPhrases,textes:rTextes,vf:rVF,recon:rRecon,bilan:rBilan};
  document.getElementById('content').innerHTML = (map[ongletCourant]||(()=> ''))();
}

function rMots(){
  return motsF().map((m,i)=>
    '<div class="card center">'
    + '<span class="badge '+badgeClass(m.cat)+'">'+m.cat+'</span>'
    + '<div class="heb heb-xl">'+H(m.heb)+'</div>'
    + '<div style="margin:8px 0">'+audioBtn(m.heb)+'</div>'
    + '<div class="fr fr-hidden" id="fr'+i+'" onclick="this.classList.remove(\'fr-hidden\')" style="font-size:20px">'+esc(m.fr)+'</div>'
    + '<div class="reveal" style="display:inline-block;margin-top:8px" onclick="document.getElementById(\'fr'+i+'\').classList.remove(\'fr-hidden\')">Révéler la traduction</div>'
    + '<div class="sens">Sens : '+esc(m.sens)+'</div>'
    + '</div>').join('');
}
function rMorpho(){
  return motsF().map(m=>
    '<div class="card">'
    + '<div class="heb heb-lg center">'+H(m.heb)+'</div>'
    + '<div class="morpho-row">'
    +   '<span class="k">Racine</span><span class="morpho-he">'+m.racine+'</span>'
    +   '<span class="k">Nature</span><span>'+esc(m.nature)+'</span>'
    +   '<span class="k">Genre / Nombre</span><span>'+esc(m.genre)+' · '+esc(m.nombre)+'</span>'
    +   '<span class="k">Formes</span><span class="morpho-he">'+H(m.formes)+'</span>'
    +   '<span class="k">Emploi</span><span>'+esc(m.emploi)+'</span>'
    + '</div></div>').join('');
}
function rLexique(){
  return '<div class="card"><table class="lex"><tr><th>Hébreu</th><th>Translit.</th><th>Français</th></tr>'
    + motsF().map(m=>'<tr><td class="he">'+H(m.heb)+'</td><td>'+esc(m.translit)+'</td><td class="fr">'+esc(m.fr)+'</td></tr>').join('')
    + '</table></div>';
}
function rPhrases(){
  return JEU.phrases.map(p=>
    '<div class="card">'
    + '<div class="heb heb-md" style="text-align:right">'+H(p.heb)+'</div>'
    + '<div style="margin:6px 0">'+audioBtn(p.heb)+'</div>'
    + '<div class="fr">'+esc(p.fr)+'</div>'
    + '</div>').join('');
}
function rTextes(){
  return JEU.textes.map(t=>
    '<div class="card">'
    + '<span class="badge b-autre">'+esc(t.titre)+'</span>'
    + '<div class="heb heb-md" style="text-align:right">'+H(t.heb)+'</div>'
    + '<div style="margin:6px 0">'+audioBtn(t.heb)+'</div>'
    + '<div class="fr">'+esc(t.fr)+'</div>'
    + '</div>').join('');
}

let vfList=[], vfIdx=0;
function rVF(){
  if(!vfList.length) buildVF();
  if(vfIdx>=vfList.length){
    return '<div class="card center"><h3>Quiz terminé</h3><p style="font-size:18px;margin:10px 0">'+score.ok+' justes · '+score.ko+' erreurs</p><button class="btn btn-g" onclick="resetVF()">Recommencer</button></div>';
  }
  const q=vfList[vfIdx];
  return '<div class="card q-card center" id="qc">'
    + '<div class="heb heb-xl">'+H(q.heb)+'</div>'
    + '<div style="margin:8px 0">'+audioBtn(q.heb)+'</div>'
    + '<div style="font-size:12px;color:#bbb;text-transform:uppercase;letter-spacing:.8px;margin:8px 0 2px">Traduction proposée</div>'
    + '<div class="fr" style="font-size:22px;margin-bottom:16px">'+esc(q.propose)+'</div>'
    + '<div class="row" style="justify-content:center">'
    +   '<button class="btn btn-v" onclick="ansVF(true)">✓ Vrai</button>'
    +   '<button class="btn btn-f" onclick="ansVF(false)">✗ Faux</button>'
    + '</div></div>';
}
function buildVF(){
  const mots=motsF(); vfList=[]; vfIdx=0;
  mots.forEach(m=>{
    const vrai = Math.random()<0.5;
    let propose = m.fr;
    if(!vrai){ const autres=mots.filter(x=>x.fr!==m.fr); propose=(autres[Math.floor(Math.random()*autres.length)]||m).fr; }
    vfList.push({heb:m.heb, propose, vrai: propose===m.fr});
  });
  vfList.sort(()=>Math.random()-0.5);
}
function ansVF(rep){
  const q=vfList[vfIdx]; const bon=(rep===q.vrai);
  bon?score.ok++:score.ko++;
  const qc=document.getElementById('qc'); if(qc) qc.classList.add(bon?'correct':'wrong');
  setTimeout(()=>{ vfIdx++; render(); },650);
}
function resetVF(){ vfList=[]; vfIdx=0; render(); }

let reconIdx=0, reconChoix=[], reconBank=null;
function rRecon(){
  const p=JEU.phrases[reconIdx];
  const mots=strip(p.heb).split(/\s+/).filter(Boolean);
  if(!reconBank){ reconBank = mots.map((w,i)=>({w,i})).slice().sort(()=>Math.random()-0.5); }
  const zone = reconChoix.map(c=>'<span class="tile" onclick="reconRetire('+c.i+')">'+c.w+'</span>').join('');
  const tiles = reconBank.map(b=>'<span class="tile'+(reconChoix.find(c=>c.i===b.i)?' used':'')+'" onclick="reconAjoute('+b.i+')">'+b.w+'</span>').join('');
  const fini = reconChoix.length===mots.length;
  const ok = fini && reconChoix.map(c=>c.w).join(' ')===mots.join(' ');
  return '<div class="card">'
    + '<div class="fr center" style="margin-bottom:6px">'+esc(p.fr)+'</div>'
    + '<div class="titre-mini center">Remets les mots dans l\'ordre (droite → gauche)</div>'
    + '<div class="zone">'+ (zone||'<span style="color:#bbb">…</span>') +'</div>'
    + '<div class="tiles">'+tiles+'</div>'
    + (fini ? '<div class="center" style="font-size:18px;color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'✓ Correct !':'✗ Pas encore')+'</div>' : '')
    + '<div class="row" style="justify-content:center;margin-top:12px">'
    +   '<button class="btn btn-o" onclick="reconReset()">Effacer</button>'
    +   '<button class="btn btn-g" onclick="reconNext()">Phrase suivante</button>'
    + '</div></div>';
}
function reconAjoute(i){ const m=strip(JEU.phrases[reconIdx].heb).split(/\s+/)[i]; if(!reconChoix.find(c=>c.i===i)){ reconChoix.push({w:m,i}); render(); } }
function reconRetire(i){ reconChoix=reconChoix.filter(c=>c.i!==i); render(); }
function reconReset(){ reconChoix=[]; reconBank=null; render(); }
function reconNext(){ reconIdx=(reconIdx+1)%JEU.phrases.length; reconChoix=[]; reconBank=null; render(); }

function rBilan(){
  const tot=score.ok+score.ko; const pct=tot?Math.round(score.ok/tot*100):0;
  return '<div class="card">'
    + '<div class="bilan-pct">'+pct+'%</div>'
    + '<div class="center titre-mini" style="margin-bottom:14px">taux de réussite</div>'
    + '<div class="bilan-line"><span>Réponses justes</span><b style="color:var(--green)">'+score.ok+'</b></div>'
    + '<div class="bilan-line"><span>Erreurs</span><b style="color:var(--red)">'+score.ko+'</b></div>'
    + '<div class="bilan-line"><span>Total</span><b>'+tot+'</b></div>'
    + '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-o" onclick="score={ok:0,ko:0};render()">Remettre à zéro</button></div>'
    + '</div>';
}

initReglages(); initTabs(); render();
</script>
</body>
</html>
