<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poème — Fiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e4;      /* parchemin clair */
  --paper2:#fdfaf3;     /* carte plus claire */
  --ink:#2c2621;        /* encre chaude */
  --ink2:#5c5348;       /* gris chaud */
  --ink3:#8a7f70;
  --line:#d9cdb4;       /* filet */
  --gold:#a9803e;       /* bronze */
  --gold2:#c19a5b;
  --accent:#7a2e2e;     /* bordeaux discret pour titres de section */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Spectral',Georgia,serif;
  background:
    radial-gradient(ellipse at 12% 6%,rgba(169,128,62,.06) 0%,transparent 55%),
    radial-gradient(ellipse at 90% 96%,rgba(122,46,46,.05) 0%,transparent 55%),
    var(--paper);
  color:var(--ink);
  font-size:13pt;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:820px;margin:0 auto;padding:48px 40px 90px}

/* En-tête */
.head{text-align:center;margin-bottom:14px}
.kicker{font-family:'Spectral',serif;font-style:italic;color:var(--gold);font-size:12pt;letter-spacing:.5px;margin-bottom:6px}
.title-he{font-family:'Frank Ruhl Libre',serif;direction:rtl;font-weight:700;font-size:34pt;line-height:1.25;color:var(--ink)}
.title-fr{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22pt;color:var(--accent);margin-top:2px}
.author{font-family:'Spectral',serif;font-style:italic;color:var(--ink2);font-size:13pt;margin-top:4px}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--gold);margin:22px auto;max-width:340px}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.rule span{font-size:14pt;opacity:.7}

/* Analyse globale */
.intro{font-family:'Spectral',serif;font-size:13.5pt;line-height:1.85;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:4px;padding:22px 26px;margin:8px 0 38px}
.intro .lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15pt;
  color:var(--accent);letter-spacing:.5px;display:block;margin-bottom:8px}

/* Quatrains */
.section-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20pt;
  color:var(--accent);margin:34px 0 4px;text-align:center}
.section-sub{text-align:center;color:var(--ink3);font-style:italic;font-size:11.5pt;margin-bottom:22px}

.quatrain{margin:0 0 40px;padding:0 0 34px;border-bottom:1px solid var(--line)}
.quatrain:last-of-type{border-bottom:none}
.q-num{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);
  font-size:15pt;text-align:center;margin-bottom:14px}
.q-num::before,.q-num::after{content:'·';margin:0 10px;color:var(--gold2)}

.verse{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;
  font-size:22pt;line-height:2.05;font-weight:500;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-radius:4px;
  padding:20px 24px}

/* deux lignes vides entre hébreu et traduction (demande de Moty) */
.gap{height:2.4em}

.trans{font-family:'Spectral',serif;font-style:italic;direction:ltr;text-align:left;
  color:var(--ink2);font-size:13pt;line-height:1.7;padding:0 4px}

.analysis{font-family:'Spectral',serif;direction:ltr;text-align:left;
  font-size:13pt;line-height:1.85;color:var(--ink);margin-top:18px}
.analysis .lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13.5pt;
  color:var(--gold);letter-spacing:.4px;display:block;margin-bottom:4px}

/* Lexique */
.lex-wrap{margin-top:26px}
table.lex{width:100%;border-collapse:collapse;background:var(--paper2);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
table.lex caption{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:18pt;
  color:var(--accent);text-align:center;padding:14px 0 4px;caption-side:top}
table.lex th,table.lex td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5pt}
table.lex th{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.6px;font-size:11pt;text-align:left}
table.lex td.he{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;
  font-size:17pt;font-weight:500;white-space:nowrap}
table.lex td.tr{font-style:italic;color:var(--ink2)}
table.lex tr:last-child td{border-bottom:none}

.copyright{margin:44px auto 0;padding-top:16px;border-top:1px solid var(--line);
  text-align:center;font-family:'Spectral',serif;font-size:10.5pt;color:var(--ink3);font-style:italic}

.empty{text-align:center;color:var(--ink3);padding:60px 20px;font-style:italic;font-size:13pt}
.empty .mark{font-size:34pt;color:var(--gold);display:block;margin-bottom:10px}

@media print{
  body{background:#fff}
  .sheet{max-width:none;padding:0}
  .intro,.verse,table.lex{background:#fff}
  .quatrain{page-break-inside:avoid}
}
@media(max-width:560px){
  .sheet{padding:30px 18px 70px}
  .title-he{font-size:27pt}.title-fr{font-size:18pt}
  .verse{font-size:19pt}
  body{font-size:12.5pt}
}
</style>

const JEU = {"titre":"גוש השינוי","auteur":"Ynet","youtube":"","shironet":"","mots":[{"heb":"גּוּשׁ","translit":"goush","fr":"bloc (politique)","sens":"nom masculin singulier construit","racine":"ג-ו-שׁ","nature":"nom","genre":"m","nombre":"s","formes":"גּוּשִׁים","cat":"noms","emploi":"Le terme désigne un bloc ou une coalition de partis politiques alliés."},{"heb":"אֵיזֶנְקוֹט","translit":"Eisenkot","fr":"Eisenkot (nom propre, homme politique israélien)","sens":"nom propre masculin","racine":"nom propre","nature":"nom","genre":"m","nombre":"s","formes":"—","cat":"noms","emploi":"Gadi Eisenkot, ancien chef d'état-major et figure politique du centre-gauche israélien."},{"heb":"מֵעַל רֹאשׁוֹ","translit":"me'al rosho","fr":"à son insu, par-dessus sa tête","sens":"expression prépositionnelle idiomatique","racine":"ר-א-שׁ","nature":"expression","genre":"—","nombre":"—","formes":"—","cat":"autre","emploi":"Expression figée signifiant agir sans consulter quelqu'un, derrière son dos."},{"heb":"נוֹעַד","translit":"no'ad","fr":"s'est réuni, a tenu une réunion","sens":"nif'al, passé, 3e personne masculin singulier","racine":"י-ע-ד","nature":"verbe","genre":"m","nombre":"s","formes":"נוֹעֵד · יִוָּעֵד · הִוָּעֵד","cat":"verbes","emploi":"Verbe indiquant qu'une réunion a été organisée et tenue."},{"heb":"אֲרֻכָּה","translit":"arokha","fr":"longue","sens":"adjectif féminin singulier (s'accorde avec פְּגִישָׁה)","racine":"א-ר-כ","nature":"adjectif","genre":"f","nombre":"s","formes":"אָרֹךְ · אֲרֻכִּים","cat":"adjectifs","emploi":"Qualifie la réunion comme exceptionnellement longue, soulignant son importance."},{"heb":"לִשְׁכָּה","translit":"lishka","fr":"bureau (officiel)","sens":"nom féminin singulier","racine":"ל-שׁ-כ","nature":"nom","genre":"f","nombre":"s","formes":"לִשְׁכּוֹת","cat":"noms","emploi":"Désigne le bureau institutionnel d'un responsable politique ou gouvernemental."},{"heb":"תִּדְרוּךְ בִּטְחוֹנִי","translit":"tidrukh bitkhoni","fr":"briefing sécuritaire","sens":"syntagme nominal masculin singulier","racine":"ד-ר-כ / ב-ט-ח","nature":"expression","genre":"m","nombre":"s","formes":"—","cat":"autre","emploi":"Expression officielle désignant une réunion d'information sur des questions de sécurité, souvent utilisée comme prétexte."},{"heb":"לְפוֹרֵר","translit":"lefoarer","fr":"faire éclater, désagréger, émietter","sens":"pi'el, infinitif","racine":"פ-ר-ר","nature":"verbe","genre":"—","nombre":"—","formes":"מְפוֹרֵר · פּוֹרֵר · יְפוֹרֵר","cat":"verbes","emploi":"Verbe fort exprimant la destruction progressive d'une unité politique, par fragmentation."},{"heb":"הִתְחַמֵּק","translit":"hitkhamek","fr":"esquiver, se dérober","sens":"hitpa'el, passé, 3e personne masculin singulier","racine":"ח-מ-ק","nature":"verbe","genre":"m","nombre":"s","formes":"מִתְחַמֵּק · יִתְחַמֵּק · הִתְחַמְּקוּת","cat":"verbes","emploi":"Indique que Bennett évitait délibérément de répondre aux questions posées."},{"heb":"מְקוֹרָב","translit":"mekorav","fr":"proche (d'un personnage politique), source proche","sens":"nom masculin singulier, avec pronom suffixe 3ms","racine":"ק-ר-ב","nature":"nom","genre":"m","nombre":"s","formes":"מְקוֹרָבִים · מְקוֹרָבוֹ","cat":"noms","emploi":"Terme journalistique désignant une source de l'entourage proche d'un responsable, souvent anonyme."},{"heb":"נֶחֱרֶצֶת","translit":"nekhéretzet","fr":"catégorique, tranchée, déterminée","sens":"nif'al, participe adjectival féminin singulier","racine":"ח-ר-צ","nature":"adjectif","genre":"f","nombre":"s","formes":"נֶחֱרָץ · נֶחֱרָצִים","cat":"adjectifs","emploi":"Qualifie la déclaration comme définitive et sans ambiguïté."},{"heb":"לָלֶכֶת הַבַּיְתָה","translit":"lalekhet habayta","fr":"rentrer à la maison / quitter la scène politique","sens":"expression verbale idiomatique","racine":"ה-ל-כ / ב-י-ת","nature":"expression","genre":"—","nombre":"—","formes":"—","cat":"autre","emploi":"Métaphore politique signifiant se retirer du pouvoir, perdre sa légitimité à gouverner."},{"heb":"חַיָּב","translit":"khayav","fr":"il doit, il est obligé","sens":"adjectif prédicatif masculin singulier, valeur modale forte","racine":"ח-י-ב","nature":"adjectif","genre":"m","nombre":"s","formes":"חַיֶּבֶת · חַיָּבִים","cat":"adjectifs","emploi":"Exprime une obligation catégorique, un jugement sans appel sur la nécessité de départ de Bennett."},{"heb":"בְּחִירוֹת","translit":"bekhirot","fr":"élections","sens":"nom féminin pluriel","racine":"ב-ח-ר","nature":"nom","genre":"f","nombre":"p","formes":"בְּחִירָה","cat":"noms","emploi":"Désigne les élections législatives israéliennes, contexte central de l'article."},{"heb":"מַתְקָפָה","translit":"matkapha","fr":"attaque, offensive (verbale ou politique)","sens":"nom féminin singulier","racine":"ת-ק-פ","nature":"nom","genre":"f","nombre":"s","formes":"מַתְקָפוֹת","cat":"noms","emploi":"Terme journalistique désignant une offensive politique ou verbale contre un adversaire."}],"phrases":[{"heb":"נְתַנְיָהוּ מְנַסֶּה לְפוֹרֵר אֶת הַגּוּשׁ","fr":"Netanyahou essaie de faire éclater le bloc"},{"heb":"מֵעַל רֹאשׁוֹ שֶׁל אֵיזֶנְקוֹט","fr":"Dans le dos d'Eisenkot / à l'insu d'Eisenkot"},{"heb":"מֵעַל רֹאשׁוֹ שֶׁל אֵיזֶנְקוֹט נוֹעַד לִפְגִישָׁה","fr":"Dans le dos d'Eisenkot, il a tenu une réunion"},{"heb":"יוּ\"ר בְּיַחַד נוֹעַד לִפְגִישָׁה אֲרֻכָּה","fr":"Le président de Beyahad a tenu une réunion longue"},{"heb":"פְּגִישָׁה אֲרֻכָּה בְּמִיּוּחָד","fr":"une réunion particulièrement longue"},{"heb":"הַשְּׁנַיִּים יָשְׁבוּ בַּלִּשְׁכָּה בַּכְּנֶסֶת","fr":"Les deux hommes se sont retrouvés dans le bureau de la Knesset"},{"heb":"פְּגִישָׁה שֶׁהוּגְדְּרָה כְּ'תִּדְרוּךְ בִּטְחוֹנִי'","fr":"une réunion officiellement qualifiée de briefing sécuritaire"},{"heb":"נְתַנְיָהוּ מְנַסֶּה לְפוֹרֵר אֶת הַגּוּשׁ","fr":"Netanyahou essaie de faire éclater le bloc"},{"heb":"בֶּנֶּט שֶׁהִתְחַמֵּק מִשְּׁאֵלוֹת","fr":"Bennett qui esquivait les questions"},{"heb":"הַתְּגוּבָה שֶׁל מְקוֹרָבוֹ","fr":"la réaction de ses proches"},{"heb":"הַהַצְהָרָה הַנֶּחֱרֶצֶת שֶׁלּוֹ","fr":"sa déclaration catégorique"},{"heb":"הוּא חַיָּב לָלֶכֶת הַבַּיְתָה","fr":"il doit quitter la scène politique"},{"heb":"הוּא חַיָּב לָלֶכֶת הַבַּיְתָה","fr":"il doit absolument partir"},{"heb":"3 יָמִים לִפְנֵי הַבְּחִירוֹת","fr":"trois jours avant les élections"},{"heb":"הַמַּתְקָפָה עַל בֶּנֶּט","fr":"l'attaque contre Bennett"}],"quatrains":[{"heb":"מֵעַל רֹאשׁוֹ שֶׁל אֵיזֶנְקוֹט, יוּ\"ר בְּיַחַד נוֹעַד לִפְגִישָׁה אֲרֻכָּה בְּמִיּוּחָד עִם רֹה\"מ.","fr":"Dans le dos d'Eisenkot, le président de Beyahad a tenu une réunion particulièrement longue avec le Premier ministre.","an":"L'expression 'מֵעַל רֹאשׁוֹ' (littéralement 'au-dessus de sa tête') est une tournure idiomatique hébraïque signifiant 'à son insu', 'sans le consulter', 'par-dessus lui'. Elle installe d'emblée un climat de méfiance et de trahison interne. 'יוּ\"ר בְּיַחַד' désigne le président du parti Beyahad (littéralement 'Ensemble'), parti politique israélien. 'רֹה\"מ' est l'abréviation courante de 'רֹאשׁ הַמֶּמְשָׁלָה' (Premier ministre), ici Netanyahou implicitement. La réunion qualifiée d'exceptionnellement longue ('אֲרֻכָּה בְּמִיּוּחָד') souligne l'importance et le caractère inhabituel de cette rencontre, amplifiant la suspicion. Le registre est journalistique allusif: on ne dit pas explicitement qu'il s'agit d'une trahison, mais toute la construction syntaxique l'implique."},{"heb":"הַשְּׁנַיִּים יָשְׁבוּ בַּלִּשְׁכָּה בַּכְּנֶסֶת, בִּפְגִישָׁה שֶׁהוּגְדְּרָה כְּ'תִּדְרוּךְ בִּטְחוֹנִי': 'נְתַנְיָהוּ מְנַסֶּה לְפוֹרֵר אֶת הַגּוּשׁ'.","fr":"Les deux hommes se sont retrouvés dans le bureau de la Knesset, lors d'une réunion officiellement qualifiée de 'briefing sécuritaire': 'Netanyahou essaie de faire éclater le bloc.'","an":"Le mot 'לִשְׁכָּה' désigne le bureau officiel, ici à la Knesset (Parlement israélien), conférant une solennité institutionnelle à la réunion. Le terme 'תִּדְרוּךְ בִּטְחוֹנִי' (briefing sécuritaire) est présenté entre guillemets, indiquant que c'est la définition officielle donnée — le journaliste laisse entendre qu'il s'agit d'un prétexte ou d'une couverture. Le verbe 'לְפוֹרֵר' (de la racine פ-ר-ר, émietter, fragmenter) est expressif et chargé: il ne dit pas simplement 'diviser' mais 'réduire en miettes', 'désagréger', ce qui traduit une accusation grave. 'הַגּוּשׁ' désigne le bloc politique de l'opposition. La citation directe sans attribution claire d'un locuteur est un procédé journalistique courant pour relayer une accusation tout en maintenant une apparence d'objectivité."},{"heb":"הַמַּתְקָפָה עַל בֶּנֶּט שֶׁהִתְחַמֵּק מִשְּׁאֵלוֹת, הַתְּגוּבָה שֶׁל מְקוֹרָבוֹ — וְהַהַצְהָרָה הַנֶּחֱרֶצֶת שֶׁלּוֹ 3 יָמִים לִפְנֵי הַבְּחִירוֹת.","fr":"L'attaque contre Bennett qui esquivait les questions, la réaction de ses proches — et sa déclaration catégorique trois jours avant les élections.","an":"Cette phrase a une structure nominale pure (aucun verbe conjugué): elle fonctionne comme un chapeau de section ou un sommaire annonciatoire, procédé fréquent dans le journalisme en ligne israélien pour créer du suspense et inciter à lire la suite. 'הִתְחַמֵּק' (se dérober, esquiver) est à la forme hitpa'el, indiquant une action réflexive ou récurrente: Bennett esquivait activement, ce n'est pas accidentel. 'מְקוֹרָבוֹ' (ses proches, son entourage) est un terme journalistique classique pour des sources anonymes liées à un personnage. L'adjectif 'נֶחֱרֶצֶת' (catégorique, tranchée, déterminée) souligne le caractère définitif de la déclaration à venir. La mention '3 jours avant les élections' ancre le texte dans une urgence temporelle dramatisée, typique de la couverture électorale."},{"heb":"'לֹא אֶעֱנֶה לוֹ לַטֶּלֶפוֹן, הוּא חַיָּב לָלֶכֶת הַבַּיְתָה'","fr":"'Je ne répondrai pas à ses appels, il doit rentrer à la maison (quitter la scène politique).'","an":"Cette citation directe constitue le clou de l'article, sa formule choc. 'לֹא אֶעֱנֶה לוֹ לַטֶּלֶפוֹן' est une expression très concrète et familière: refuser de décrocher le téléphone pour quelqu'un est, dans la culture populaire israélienne, le signe ultime de rupture personnelle et politique. L'expression 'לָלֶכֶת הַבַּיְתָה' (rentrer à la maison) est une métaphore politique courante en hébreu signifiant 'quitter le pouvoir', 'se retirer de la vie politique' — équivalent de 'rendre le tablier'. L'obligation exprimée par 'חַיָּב' (il doit, il est obligé) donne un ton impératif et sans appel. La phrase courte, coupée en deux assertions brèves, reflète un style oral retranscrit, donnant l'impression d'une déclaration spontanée et authentique — ce que les journalistes cherchent à valoriser pour son impact sur le lecteur."}],"analyse":"Cet extrait provient de Ynet, grand média d'information en ligne israélien, dans la rubrique 'Goush HaShinouï' (le bloc du changement), couvrant les manœuvres politiques au sein de l'opposition ou de la coalition anti-Netanyahou à la veille d'élections. L'angle est celui de la chronique politique interne: tensions, trahisons pressenties et déclarations fracassantes entre leaders du même camp. Le registre est journalistique populaire, dynamique, avec des formules chocs et un style narratif haletant typique de la presse en ligne israélienne."};
/* ↑ VIDE en production — l'IA remplit titre/auteur/analyse/quatrains/mots. */

const NIKOUD=/[\u0591-\u05C7]/g;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function br(s){return esc(s).split('\n').join('<br>');}

function render(){
  const el=document.getElementById('sheet');
  if(!JEU.quatrains || !JEU.quatrains.length){
    el.innerHTML='<div class="empty"><span class="mark">✦</span>En attente du poème.<br>La fiche se remplit dès que la leçon est générée.</div>';
    return;
  }
  let h='';
  h+='<div class="head">';
  h+='<div class="kicker">Fiche de lecture — poésie hébraïque</div>';
  h+='<div class="title-he">'+esc(JEU.titre||'שיר')+'</div>';
  if(JEU.auteur) h+='<div class="author">'+esc(JEU.auteur)+'</div>';
  h+='</div>';
  h+='<div class="rule"><span>✦</span></div>';

  if(JEU.analyse){
    h+='<div class="intro"><span class="lbl">Vue d\u2019ensemble</span>'+br(JEU.analyse)+'</div>';
  }

  h+='<div class="section-title">Le poème, quatrain par quatrain</div>';
  h+='<div class="section-sub">texte · traduction · analyse</div>';

  JEU.quatrains.forEach(function(q,i){
    h+='<div class="quatrain">';
    h+='<div class="q-num">Quatrain '+(i+1)+'</div>';
    h+='<div class="verse">'+br(q.heb)+'</div>';
    h+='<div class="gap"></div>';
    h+='<div class="trans">'+br(q.fr)+'</div>';
    if(q.an){ h+='<div class="analysis"><span class="lbl">Analyse</span>'+br(q.an)+'</div>'; }
    h+='</div>';
  });

  if(JEU.mots && JEU.mots.length){
    h+='<div class="lex-wrap"><table class="lex"><caption>Lexique</caption>';
    h+='<tr><th>Hébreu</th><th>Translittération</th><th>Français</th></tr>';
    JEU.mots.forEach(function(m){
      h+='<tr><td class="he">'+esc(m.heb||m.h||'')+'</td><td class="tr">'+esc(m.translit||m.t||'')+'</td><td>'+esc(m.fr||m.f||'')+'</td></tr>';
    });
    h+='</table></div>';
  }

  h+='<div class="copyright">© 2026 hebreu-zen — Toutes reproductions interdites et réservées</div>';
  el.innerHTML=h;
}
render();
</script>
</body></html>
