<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test inscription — diagnostic</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 16pt; }
  label { display: block; margin-top: .8rem; font-size: 11pt; }
  input { width: 100%; padding: .5rem; font-size: 12pt; box-sizing: border-box; }
  button { margin-top: 1.2rem; padding: .7rem 1.4rem; font-size: 12pt; cursor: pointer; }
  #sortie { margin-top: 1.5rem; padding: 1rem; background: #f4f4f4; white-space: pre-wrap;
            font-family: ui-monospace, monospace; font-size: 10pt; min-height: 3rem; }
  .ok { border-left: 4px solid green; }
  .ko { border-left: 4px solid crimson; }
</style>
</head>
<body>

<h1>Test — webhook inscription</h1>

<label>Identifiant <input id="identifiant" value="david9"></label>
<label>Prénom <input id="prenom" value="David"></label>
<label>Téléphone <input id="telephone" value="+33663936034"></label>
<label>Date de naissance <input id="date_naissance" type="date" value="1985-06-15"></label>

<button id="envoyer">Envoyer l'inscription</button>

<div id="sortie">En attente…</div>

<script>
var URL_INSCRIPTION = "https://n8n.srv1704612.hstgr.cloud/webhook/inscription";

var sortie = document.getElementById("sortie");

function afficher(texte, classe) {
  sortie.textContent = texte;
  sortie.className = classe || "";
}

document.getElementById("envoyer").addEventListener("click", function () {
  var donnees = {
    identifiant: document.getElementById("identifiant").value,
    prenom: document.getElementById("prenom").value,
    telephone: document.getElementById("telephone").value,
    date_naissance: document.getElementById("date_naissance").value
  };

  afficher("Envoi en cours…\n\n" + JSON.stringify(donnees, null, 2));

  fetch(URL_INSCRIPTION, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(donnees)
  })
  .then(function (reponse) {
    return reponse.text().then(function (texte) {
      afficher(
        "STATUT HTTP : " + reponse.status + "\n\nRÉPONSE :\n" + texte,
        reponse.ok ? "ok" : "ko"
      );
    });
  })
  .catch(function (erreur) {
    afficher(
      "ÉCHEC DE L'APPEL\n\n" + erreur.message +
      "\n\n→ Ouvre la console du navigateur (F12 ou Cmd+Option+I)." +
      "\n→ Si elle parle de CORS : le webhook n8n n'autorise pas ce site." +
      "\n→ Si elle parle de 404 : URL ou workflow non publié.",
      "ko"
    );
  });
});
</script>

</body>
</html>
